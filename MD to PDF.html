<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markdown → PDF Converter</title>
<!-- Marked: Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Highlight.js: Code syntax highlighting -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<!-- html2pdf: HTML → PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 20px; background: #f4f6f8;
  }
  .app {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  header {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; padding: 15px 20px; border-radius: 8px;
    box-shadow: 0 2px 4px rgba(0,0,0,.05);
  }
  header h1 { margin: 0; font-size: 20px; }
  .controls { display: flex; gap: 10px; align-items: center; }
  button, label.btn {
    background: #2563eb; color: #fff; border: none;
    padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  button:hover, label.btn:hover { background: #1d4ed8; }
  button.secondary { background: #64748b; }
  button.secondary:hover { background: #475569; }
  input[type="file"] { display: none; }
  .option {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #475569;
  }
  .panel {
    background: #fff; border-radius: 8px; padding: 15px;
    box-shadow: 0 2px 4px rgba(0,0,0,.05);
    display: flex; flex-direction: column; height: 75vh;
  }
  .panel h2 { margin: 0 0 10px; font-size: 14px; color: #64748b; text-transform: uppercase; }
  #editor {
    flex: 1; width: 100%; border: 1px solid #e2e8f0;
    border-radius: 6px; padding: 12px; font-family: "SF Mono", Consolas, monospace;
    font-size: 13px; resize: none; outline: none;
  }
  #preview {
    flex: 1; overflow-y: auto; padding: 20px;
    border: 1px solid #e2e8f0; border-radius: 6px;
  }
  /* Markdown styling */
  #preview h1, #preview h2 { border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
  #preview code {
    background: #f6f8fa; padding: 2px 5px; border-radius: 3px;
    font-family: "SF Mono", Consolas, monospace; font-size: 90%;
  }
  #preview pre {
    background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto;
  }
  #preview pre code { background: none; padding: 0; }
  #preview blockquote {
    border-left: 4px solid #dfe2e5; color: #6a737d;
    padding: 0 1em; margin-left: 0;
  }
  #preview table { border-collapse: collapse; width: 100%; }
  #preview th, #preview td { border: 1px solid #dfe2e5; padding: 6px 12px; }
  #preview th { background: #f6f8fa; }
  #preview img { max-width: 100%; }
  #preview details {
    border: 1px solid #e2e8f0; border-radius: 6px;
    padding: 8px 12px; margin: 10px 0;
  }
  #preview summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📝 Markdown → PDF</h1>
    <div class="controls">
      <label class="option">
        <input type="checkbox" id="expandDetails" checked>
        Expand all details
      </label>
      <label class="btn" for="fileInput">📂 Load .md</label>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt">
      <button id="sampleBtn" class="secondary">Sample</button>
      <button id="downloadBtn">⬇ Download PDF</button>
    </div>
  </header>

  <div class="panel">
    <h2>Markdown Source</h2>
    <textarea id="editor" placeholder="Type or paste Markdown here..."></textarea>
  </div>

  <div class="panel">
    <h2>Preview</h2>
    <div id="preview"></div>
  </div>
</div>

<script>
  const editor    = document.getElementById('editor');
  const preview   = document.getElementById('preview');
  const fileInput = document.getElementById('fileInput');
  const expandChk = document.getElementById('expandDetails');

  // Configure marked with syntax highlighting
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    }
  });

  function render() {
    preview.innerHTML = marked.parse(editor.value || '');
  }
  editor.addEventListener('input', render);

  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { editor.value = ev.target.result; render(); };
    reader.readAsText(file);
  });

  document.getElementById('sampleBtn').addEventListener('click', () => {
    editor.value = `# Sample Document

## Introduction
This is a **Markdown** document that will be converted to *PDF*.

<details>
<summary>Click to expand extra notes</summary>

This hidden content will **automatically be expanded** in the PDF output.

- Point one
- Point two

</details>

## Code Example
\`\`\`javascript
function greet(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

| Item | Qty | Price |
|------|-----|-------|
| Apple | 3 | $1.50 |
| Bread | 1 | $3.00 |
`;
    render();
  });

  // 🔑 Key change: expand <details> before generating PDF
  document.getElementById('downloadBtn').addEventListener('click', async () => {
    const detailsEls = preview.querySelectorAll('details');
    const originalStates = [];

    if (expandChk.checked) {
      detailsEls.forEach(d => {
        originalStates.push(d.open);
        d.open = true;
      });
    }

    // Give the browser a tick to reflow
    await new Promise(r => requestAnimationFrame(r));

    const opt = {
      margin:       [15, 15, 15, 15],
      filename:     'document.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
    };

    try {
      await html2pdf().set(opt).from(preview).save();
    } finally {
      // Restore original open/closed states
      if (expandChk.checked) {
        detailsEls.forEach((d, i) => { d.open = originalStates[i]; });
      }
    }
  });

  render();
</script>
</body>
</html>
