<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capes! Tracker</title>
<!--
  Capes! Tracker — solo play edition. Step 1: Seats, Characters, Bookkeeping.
  Single file, no dependencies. Data autosaves to this browser's localStorage.
  Export regularly (Table tab → Save & Backup).
-->
<style>
:root{--bg:#f3efe6;--panel:#fff;--ink:#1c1c1e;--muted:#6e6a62;--line:#dcd5c5;--gold:#f5c518;--red:#c0392b;--blue:#1f5fa8;--green:#2e7d32;--amber:#a86200}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#1c1c1e;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:1px;font-style:italic}
header h1 span{color:var(--gold)}
#nav{display:flex;gap:6px}
#nav button{background:transparent;color:#ddd;border:1px solid #555}
#nav button.active{background:var(--gold);color:#000;border-color:var(--gold)}
#savestate{margin-left:auto;font-size:12px;color:#aaa}
main{max-width:1150px;margin:0 auto;padding:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;color:var(--ink)}
button:hover:not(:disabled){filter:brightness(.94)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.danger{color:var(--red)}
button.small{padding:2px 8px;font-size:13px}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:110px}
label{font-size:13px;color:var(--muted)}
label input,label select{color:var(--ink);font-size:15px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:18px}
.panel h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.ok{color:var(--green);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.spread{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.grow{flex:1;min-width:140px}
.full{width:100%}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;background:#eee;color:#333;vertical-align:middle}
.badge.super{background:#fde8a6}.badge.mundane{background:#dfe9f7}.badge.nonperson{background:#e6dff5}
.badge.err{background:#fbdada;color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f6f2e8;border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;margin:2px;font-size:13px}
.chip button{padding:0 6px;font-size:12px;border-radius:10px}
.order{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#1c1c1e;color:var(--gold);align-items:center;justify-content:center;font-weight:700}
.seat-name{font-weight:700;flex:1;min-width:100px}
.counter b{display:inline-block;min-width:28px;text-align:center;font-size:18px}
.card h3{margin:0}
.cat{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.cat h4{margin:4px 0}
.ab-row{display:flex;gap:6px;align-items:center;margin:4px 0}
.ab-row .lvl{width:58px;text-align:center;font-weight:700}
.pw{font-size:12px;color:var(--muted);white-space:nowrap;min-width:96px}
.pw.on{color:var(--amber);font-weight:600}
.validation{max-height:30vh;overflow:auto}
.validation .err{color:var(--red)}.validation .warn{color:var(--amber)}
.validation ul{margin:4px 0 6px;padding-left:20px}
.sticky{position:sticky;bottom:0;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.drive-row{display:grid;grid-template-columns:110px 70px 1fr;gap:8px;align-items:center;margin:4px 0}
.ex{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:#fcfaf5}
.cl{background:#fffbea;border:1px solid #ecd98a}
.cl summary{cursor:pointer}
.cl-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.cl-col h5{margin:0 0 6px;font-size:14px}
.cl-item{display:block;padding:3px 6px;border-radius:4px;cursor:pointer;color:var(--ink);font-size:14px}
.cl-item:hover{background:#fff3c4}
.cl-item.crossed{text-decoration:line-through;color:#999}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sheet-head h2{font-size:26px;margin:0}
.sheet-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.sheet-col h4{margin:0 0 6px;border-bottom:2px solid #1c1c1e}
.sheet-ab{display:flex;align-items:center;gap:8px;padding:3px 0}
.lvlbox{display:inline-flex;width:26px;height:26px;border:2px solid #1c1c1e;align-items:center;justify-content:center;font-weight:800;border-radius:4px;flex:none}
.bolt{color:var(--amber)}
.drive{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap;border-bottom:1px dotted var(--line)}
.drive .dname{width:100px;font-weight:700}
.drive .dstr{width:90px;color:var(--muted);font-size:13px}
.drive.over .dname{color:var(--red)}
.pips{display:inline-flex;gap:3px;min-width:140px}
.pip{width:16px;height:16px;border:2px dashed #bbb;border-radius:3px}
.pip.cap{border:2px solid #1c1c1e}
.pip.full{background:#1c1c1e}
.pip.full:not(.cap){background:var(--red);border-color:var(--red)}
.hint{background:#eef4fb;border:1px solid #c9dbf0;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:16px}
@media (max-width:600px){.drive-row{grid-template-columns:1fr 70px}.drive-row .muted{grid-column:1/-1}}
/* ===== Step 2: Scene engine ===== */
.die{display:inline-flex;width:36px;height:36px;border:2px solid #1c1c1e;border-radius:8px;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:#fff;margin:2px;padding:0;color:var(--ink)}
.die.big{width:48px;height:48px;font-size:26px;background:var(--gold)}
.conf{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fcfaf5}
.conf.resolving{border:2px solid var(--blue);background:#f4f8fd}
.conf h4{margin:10px 0 4px}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.side{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.side.ctrl{border:2px solid var(--green);background:#f3faf3}
.sidelabel{font-weight:700;border:1px dashed transparent;background:transparent;width:60%}
.sidelabel:hover,.sidelabel:focus{border-color:var(--line);background:#fff}
.badge.ev{background:#fde2c8}.badge.go{background:#d8f0d8}.badge.claim{background:#1c1c1e;color:var(--gold)}
.tool{background:#fffbea;border:1px solid #ecd98a;border-radius:8px;padding:8px 10px;margin-top:8px}
.rollp{border:2px solid var(--gold);background:#fffdf3}
.castseat{padding:6px 0;border-bottom:1px dotted var(--line)}
.castchar{display:inline-block;vertical-align:top;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px;background:#fcfaf5;font-size:13px;min-width:210px}
.castchar .over{color:var(--red);font-weight:700}
</style>
</head>

/* ================= HELPERS ================= */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const clone = o => JSON.parse(JSON.stringify(o));
const opt = (v,l,sel) => `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`;
const charById = id => state.characters.find(c => c.id === id);
const seatById = id => state.seats.find(s => s.id === id);
const hasDetailedDrives = c => c.driveMode === 'heroic' || c.driveMode === 'villainous';
const catsFor = c => c.kind === 'super' ? ['power','style','attitude'] : ['skill','style','attitude'];
const kindBadge = c => `<span class="badge ${c.kind}">${c.kind==='nonperson' ? esc(c.npType) : KIND_LABEL[c.kind]}</span>`;
const today = () => new Date().toISOString().slice(0,10);
const exName = x => (x.targetId && charById(x.targetId)) ? charById(x.targetId).name : x.name;

/* ================= STATE ================= */
function mkSeat(name){ return {id:uid(), name, storyTokens:0, inspirations:[]}; }
function defaultState(){
  return {version:1, seats:[mkSeat('Seat A'),mkSeat('Seat B'),mkSeat('Seat C')], characters:[], comicsCode:[], log:[]};
}
function makeDrives(mode, old = {}){
  const names = mode==='heroic' ? HEROIC : mode==='villainous' ? VILLAINOUS : [];
  const d = {};
  names.forEach(n => d[n] = old[n] ? {...old[n]} : {strength:1, debt:0});
  return d;
}
function blankCharacter(kind = 'super'){
  return {id:uid(), name:'', kind, npType:'Thing', concept:'', spotlightSeat:'', abilities:[],
    characterConflict:null, driveMode: kind==='super' ? 'heroic' : 'none',
    drives: kind==='super' ? makeDrives('heroic') : {}, undiffDebt:0, exemplars:[], notes:''};
}
function blankExemplar(){
  return {id:uid(), targetId:'', name:'', drive:'', root:'', conflictType:'Event', conflictText:'', sharedWithId:''};
}
function normalizeLoadedChar(ch){
  const c = {...blankCharacter(ch.kind || 'super'), ...ch};
  c.abilities = Array.isArray(c.abilities) ? c.abilities.map(a => ({id:a.id||uid(), name:a.name||'', cat:a.cat||'style', level:Number(a.level)||1, powered:!!a.powered})) : [];
  c.exemplars = Array.isArray(c.exemplars) ? c.exemplars.map(x => ({...blankExemplar(), ...x})) : [];
  if (!c.drives || typeof c.drives !== 'object') c.drives = {};
  c.undiffDebt = Number(c.undiffDebt) || 0;
  return c;
}
function normalizeState(s){
  const d = defaultState();
  const out = {...d, ...s};
  if (!Array.isArray(out.seats) || out.seats.length < 1) out.seats = d.seats;
  out.seats = out.seats.map(x => ({...mkSeat(x.name||'Seat'), ...x, storyTokens:Number(x.storyTokens)||0, inspirations:Array.isArray(x.inspirations)?x.inspirations:[]}));
  out.characters = (Array.isArray(out.characters) ? out.characters : []).map(normalizeLoadedChar);
  if (!Array.isArray(out.comicsCode)) out.comicsCode = [];
  if (!Array.isArray(out.log)) out.log = [];
  return out;
}
function load(){
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return normalizeState(JSON.parse(raw)); }
  catch(e){ console.warn('Load failed', e); }
  return defaultState();
}
function save(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setSaved('Saved ✓ ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
  } catch(e){ setSaved('⚠ Could not save — export a backup!'); }
}
function setSaved(t){ const el = document.getElementById('savestate'); if (el) el.textContent = t; }
function addLog(msg){ state.log.push({t:Date.now(), msg}); if (state.log.length > 300) state.log.shift(); }

let state = load();
let ui = {tab:'table', draft:null, viewId:null, cl:null, clOpen:false, filter:'', importMode:null};

/* ================= RULES CHECKS ================= */
function totalDebt(c){
  if (c.driveMode === 'undiff') return c.undiffDebt;
  if (hasDetailedDrives(c)) return Object.values(c.drives).reduce((a,d) => a + (Number(d.debt)||0), 0);
  return 0;
}
function overdrawnDrives(c){
  if (c.driveMode === 'undiff') return c.undiffDebt > 5 ? ['Debt'] : [];
  if (hasDetailedDrives(c)) return Object.entries(c.drives).filter(([,d]) => d.debt > d.strength).map(([n]) => n);
  return [];
}
function validate(c){
  const E = [], W = [];
  const cats = catsFor(c);
  if (!String(c.name||'').trim()) E.push('Give the character a name.');
  const byCat = {}; cats.forEach(k => byCat[k] = []);
  let unnamed = false;
  for (const a of c.abilities){
    if (!String(a.name||'').trim()) unnamed = true;
    if (byCat[a.cat]) byCat[a.cat].push(a);
    else E.push(`${KIND_LABEL[c.kind]} characters can't have ${CAT_LABEL[a.cat]} ("${a.name||'unnamed'}").`);
  }
  if (unnamed) E.push('Every ability needs a name.');

  if (c.kind === 'nonperson' && c.characterConflict){
    const counts = cats.map(k => byCat[k].length).filter(n => n > 0).sort((a,b) => a-b);
    if (counts.length !== 2) E.push(`With a Character Conflict, use exactly two ability columns (currently ${counts.length}).`);
    else if (!((counts[0]===4 && counts[1]===4) || (counts[0]===3 && counts[1]===5))) E.push(`The two columns must split 4/4 or 5/3 (currently ${counts.join('/')}).`);
    if (!String(c.characterConflict.text||'').trim()) E.push('Write the Character Conflict.');
  } else {
    if (c.abilities.length > 12) E.push(`At most 12 abilities (currently ${c.abilities.length}).`);
    cats.forEach(k => { const n = byCat[k].length; if (n < 3 || n > 5) E.push(`${CAT_LABEL[k]}: need 3–5 (currently ${n}).`); });
  }
  cats.forEach(k => {
    const lv = byCat[k].map(a => Number(a.level)).sort((a,b) => a-b);
    if (lv.length && !lv.every((v,i) => v === i+1)) E.push(`${CAT_LABEL[k]} must be numbered 1–${lv.length} with no gaps or repeats (currently ${lv.join(', ')}).`);
  });

  if (hasDetailedDrives(c)){
    const vals = Object.values(c.drives).map(d => Number(d.strength));
    if (vals.some(v => !Number.isInteger(v) || v < 1 || v > 5)) E.push('Each Drive Strength must be a whole number from 1 to 5.');
    const sum = vals.reduce((a,b) => a+b, 0);
    if (sum !== 9) E.push(`Drive Strengths must total exactly 9 (currently ${sum}).`);
  }
  if (c.kind !== 'super' && c.driveMode !== 'none') W.push('Drives are normally only for super-powered characters.');
  if (c.kind === 'super' && c.driveMode === 'none') W.push('This super has no Drives. Powered abilities earn Debt, so pick Drives or Undifferentiated before playing them.');

  if (c.exemplars.length){
    if (!hasDetailedDrives(c)) W.push('Exemplars are tied to detailed Drives, and this character has none.');
    const unshared = c.exemplars.filter(x => !x.sharedWithId).length;
    if (c.exemplars.length > 1 && unshared > 1) W.push('Only one Exemplar is free. Each additional one must be Shared with another character (p.77).');
    c.exemplars.forEach((x,i) => {
      const label = `Exemplar ${i+1}`;
      if (!x.targetId && !String(x.name||'').trim()) E.push(`${label} needs a character or a name.`);
      if (x.targetId && !charById(x.targetId)) W.push(`${label}'s linked character no longer exists.`);
      if (hasDetailedDrives(c) && !(x.drive in c.drives)) W.push(`${label} needs a Drive this character has.`);
      if (!String(x.conflictText||'').trim()) W.push(`${label} has no Free Conflict yet.`);
      if (!String(x.root||'').trim()) W.push(`${label} has no root conflict ("This good thing, but that bad thing").`);
    });
  }
  return {E, W};
}
function normalizeChar(c){
  c.name = c.name.trim();
  c.abilities.forEach(a => {
    a.name = String(a.name).trim();
    a.level = Number(a.level) || 1;
    if (a.cat === 'power') a.powered = true;
    else if (a.cat !== 'style' || c.kind !== 'super') a.powered = false;
    else a.powered = !!a.powered;
  });
  c.abilities.sort((a,b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) || a.level - b.level);
  Object.values(c.drives).forEach(d => { d.strength = Number(d.strength) || 1; d.debt = Number(d.debt) || 0; });
  c.exemplars.forEach(x => { const t = x.targetId && charById(x.targetId); if (t) x.name = t.name; });
}

/* ================= CLICK AND LOCK ================= */
function blankCL(){ return {set:'', persona:'', np:'', crossed:[]}; }
function clColumns(c){
  const cl = ui.cl;
  if (c.kind === 'nonperson'){
    const m = NONPERSON.find(x => x[0] === cl.np); if (!m) return null;
    return ['skill','style','attitude'].filter(k => m[2][k]).map(k => ({cat:k, items:m[2][k].map((n,i) => ({key:k+i, name:n, powered:false}))}));
  }
  const sets = c.kind === 'super' ? POWER_SETS : SKILL_SETS;
  const s = sets.find(x => x[0] === cl.set), p = PERSONAE.find(x => x[0] === cl.persona);
  if (!s || !p) return null;
  const sup = c.kind === 'super';
  return [
    {cat: sup ? 'power' : 'skill', items: s[2].map((n,i) => ({key:'a'+i, name:n, powered:sup}))},
    {cat:'style', items:[...s[3].map((n,i) => ({key:'s'+i, name:n, powered:sup})), ...p[3].map((n,i) => ({key:'t'+i, name:n, powered:false}))]},
    {cat:'attitude', items: p[2].map((n,i) => ({key:'p'+i, name:n, powered:false}))}
  ];
}
function clCheck(cols){
  const crossed = ui.cl.crossed, need = cols.length === 3 ? 3 : 2;
  if (crossed.length !== need) return {ok:false, msg:`Cross out exactly ${need} (${crossed.length} so far).`};
  if (cols.length === 3 && cols.some(col => col.items.filter(i => crossed.includes(i.key)).length === need))
    return {ok:false, msg:"Don't cross out all three from the same column."};
  return {ok:true, msg:'Ready to build.'};
}
function groupedSelect(key, list, sel){
  const groups = [...new Set(list.map(x => x[1]))];
  return `<select data-cl="${key}"><option value="">— choose —</option>${groups.map(g =>
    `<optgroup label="${esc(g)}">${list.filter(x => x[1]===g).map(x => opt(x[0], x[0], sel)).join('')}</optgroup>`).join('')}</select>`;
}
function buildFromCL(){
  const d = ui.draft, cols = clColumns(d);
  if (!cols || !clCheck(cols).ok) return;
  if (d.abilities.length && !confirm('Replace the current abilities with this Click and Lock build?')) return;
  d.abilities = [];
  cols.forEach(col => {
    let n = 0;
    col.items.filter(it => !ui.cl.crossed.includes(it.key)).forEach(it => {
      const name = it.name.startsWith('(') ? '' : it.name;
      d.abilities.push({id:uid(), name, cat:col.cat, level:++n, powered:it.powered});
    });
  });
  if (d.kind === 'nonperson'){
    const m = NONPERSON.find(x => x[0] === ui.cl.np);
    d.npType = m[1];
    d.characterConflict = m[3] ? {...m[3]} : null;
    if (!d.name.trim()) d.name = m[0];
  } else if (!d.concept.trim()) d.concept = `${ui.cl.set} / ${ui.cl.persona}`;
  ui.clOpen = false;
}

/* ================= RENDER ================= */
function render(){
  renderNav();
  const m = document.getElementById('main');
  if (ui.tab === 'table') m.innerHTML = renderTable();
  else if (ui.tab === 'characters') m.innerHTML = renderCharacters();
  else if (ui.tab === 'sheet') m.innerHTML = renderSheet();
  else if (ui.tab === 'edit'){ m.innerHTML = renderEditor(); updateValidation(); }
}
function renderNav(){
  const cur = ui.tab === 'table' ? 'table' : 'characters';
  document.getElementById('nav').innerHTML = [['table','Table'],['characters','Characters']]
    .map(([k,l]) => `<button data-a="tab" data-id="${k}" class="${k===cur?'active':''}">${l}</button>`).join('');
}

/* ---------- Table tab ---------- */
function renderTable(){
  const names = state.characters.map(c => c.name).filter(Boolean);
  const tags = [...new Set(['The heroes','The villains',...names])];
  return `
  <div class="hint"><b>Solo play:</b> each Seat is a virtual player. You play all of them, so Story Tokens can change hands the way the rules expect.

  <div class="panel">
    <div class="row spread"><h2>Seats <span class="muted">(clockwise order)</span></h2><button data-a="seat-add">+ Add Seat</button></div>
    ${state.seats.map(renderSeat).join('')}
    <datalist id="insp-tags">${tags.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
  </div>
  <div class="panel">
    <div class="row spread"><h2>Comics Code</h2><button data-a="code-example">Load 1950s example</button></div>
    <p class="muted">One rule per line. If Resolving a Conflict would break a rule here, the Resolver must Gloat instead (p.41). Change it between sessions, never during one.</p>

    ${state.log.length
      ? `<div class="muted">${state.log.slice(-30).reverse().map(l => `<div>${new Date(l.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} — ${esc(l.msg)}</div>`).join('')}</div>`

}
function renderSeat(s, i){
  const spot = state.characters.filter(c => c.spotlightSeat === s.id).map(c => c.name || '(unnamed)');
  return `<div class="ex">
    <div class="row">
      <span class="order">${i+1}</span>
      <input class="seat-name" data-seat="${s.id}" value="${esc(s.name)}">
      <span class="counter">Story Tokens
        <button class="small" data-a="st-minus" data-id="${s.id}" ${s.storyTokens<=0?'disabled':''}>−</button><b>${s.storyTokens}</b><button class="small" data-a="st-plus" data-id="${s.id}">+</button>
      </span>

      <button class="small danger" data-a="seat-del" data-id="${s.id}" ${state.seats.length<=2?'disabled':''} title="${state.seats.length<=2?'Story Tokens need at least 2 Seats':''}">Remove</button>
    </div>
    <div class="row"><span class="muted">Inspirations:</span>
      ${s.inspirations.length ? s.inspirations.map((x,j) => `<span class="chip"><b>${x.value}</b>&nbsp;for ${esc(x.forTag||'anyone')}
        <button data-a="insp-up" data-id="${s.id}" data-x="${j}" ${x.value>=6?'disabled':''} title="Raise by 1 using an Ability of level ≥ ${x.value}">+1</button>
        <button data-a="insp-del" data-id="${s.id}" data-x="${j}" title="Spend / remove">✕</button></span>`).join('') : '<span class="muted">none</span>'}
    </div>

      <input type="number" min="1" max="6" value="1" style="width:64px" data-insp-val="${s.id}" title="Value">

    </div>
    ${spot.length ? `<div class="muted">★ Spotlight: ${spot.map(esc).join(', ')}</div>` : ''}
  </div>`;

/* ---------- Characters tab ---------- */
function renderCharacters(){
  return `<div class="panel">
    <div class="row spread"><h2>Character Library <span class="muted">(${state.characters.length})</span></h2>
      <div class="row">
        <button class="primary" data-a="new-char" data-id="super">+ Super</button>
        <button class="primary" data-a="new-char" data-id="mundane">+ Mundane</button>

    <input class="full" placeholder="Filter by name, concept or type…" data-filter value="${esc(ui.filter)}">
  </div>
  <div id="charlist">${renderCharList()}</div>`;
}
function renderCharList(){
  const f = ui.filter.toLowerCase().trim();
  const list = state.characters
    .filter(c => !f || `${c.name} ${c.concept} ${c.kind==='nonperson'?c.npType:KIND_LABEL[c.kind]}`.toLowerCase().includes(f))
    .sort((a,b) => (a.name||'').localeCompare(b.name||''));
  if (!list.length) return `<p class="muted">${state.characters.length ? 'No matches.' : 'No characters yet. Make one with the buttons above. Click and Lock is the fastest start.'}</p>`;
  return `<div class="grid">${list.map(renderCard).join('')}</div>`;
}
function renderCard(c){
  const {E} = validate(c), over = overdrawnDrives(c), seat = seatById(c.spotlightSeat);
  const hasDebt = hasDetailedDrives(c) || c.driveMode === 'undiff';
  return `<div class="panel card">

    <div class="row">
      ${hasDebt ? `<span class="badge">Debt ${totalDebt(c)}</span>` : ''}
      ${over.length ? `<span class="badge err">Overdrawn: ${over.map(esc).join(', ')}</span>` : ''}
      ${E.length ? `<span class="badge err" title="${esc(E.join('\n'))}">House rule (${E.length})</span>` : ''}

      <button class="small danger" data-a="del" data-id="${c.id}">Delete</button>
    </div>

}

/* ---------- Character sheet ---------- */
function pips(str, debt){
  const n = Math.max(str, debt); let h = '';
  for (let i = 0; i < n; i++) h += `<span class="pip${i<str?' cap':''}${i<debt?' full':''}"></span>`;
  return h;
}
function driveRow(c, key, str, debt, desc){
  const over = debt > str, undiff = key === '__undiff';
  return `<div class="drive ${over?'over':''}">
    <span class="dname">${undiff ? 'Debt' : esc(key)}</span>
    <span class="dstr">${undiff ? 'Limit 5' : 'Strength ' + str}</span>
    <span class="pips">${pips(str, debt)}</span>
    <button class="small" data-a="debt-minus" data-id="${c.id}" data-x="${esc(key)}" ${debt<=0?'disabled':''}>−</button>
    <b>${debt}</b>
    <button class="small" data-a="debt-plus" data-id="${c.id}" data-x="${esc(key)}">+</button>
    ${over ? '<span class="badge err">OVERDRAWN</span>' : ''}
    <span class="muted grow">${esc(desc)}</span>
  </div>`;
}
function renderSheet(){
  const c = charById(ui.viewId);
  if (!c){ ui.tab = 'characters'; return renderCharacters(); }
  const seat = seatById(c.spotlightSeat);
  const cols = catsFor(c).map(k => {
    const abs = c.abilities.filter(a => a.cat === k).sort((a,b) => a.level - b.level);
    if (!abs.length) return '';
    return `<div class="sheet-col"><h4>${CAT_LABEL[k]}</h4>${abs.map(a => `<div class="sheet-ab"><span class="lvlbox">${a.level}</span><span>${esc(a.name)}</span>
      ${a.powered ? '<span class="bolt" title="Powered: +1 Debt per use, once per Page">⚡</span>' : '<span class="muted" title="Mundane: Blocks for the rest of the Scene after one use">▢</span>'}</div>`).join('')}</div>`;
  }).join('');

  let drives;
  if (hasDetailedDrives(c)) drives = Object.entries(c.drives).map(([n,d]) => driveRow(c, n, d.strength, d.debt, DRIVE_DESC[n])).join('');
  else if (c.driveMode === 'undiff') drives = driveRow(c, '__undiff', 5, c.undiffDebt, 'Undifferentiated: one stack, Overdrawn above 5, may Stake up to 3 per Conflict.');
  else drives = '<p class="muted">No Drives.</p>';
  const over = overdrawnDrives(c);

  const exOf = state.characters.flatMap(o => o.exemplars.filter(x => x.targetId === c.id).map(x => `${esc(o.name||'(unnamed)')} (${esc(x.drive||'?')})`));
  const exemplars = c.exemplars.map(x => {
    const shared = x.sharedWithId && charById(x.sharedWithId);
    return `<div class="ex"><b>${esc(exName(x)||'(unnamed)')}</b> <span class="badge">${esc(x.drive||'?')} Exemplar</span>
      ${shared ? ` <span class="badge">Shared with ${esc(shared.name)}</span>` : ''}
      ${x.root ? `<div class="muted">${esc(x.root)}</div>` : ''}
      ${x.conflictText ? `<div>Free ${esc(x.conflictType)}: <b>${esc(x.conflictText)}</b></div>` : ''}</div>`;
  }).join('');

  return `<div class="panel">
    <div class="sheet-head">
      <div><h2>${esc(c.name||'(unnamed)')}</h2>
        <div class="row">${kindBadge(c)}${seat ? `<span class="badge">★ ${esc(seat.name)}</span>` : ''}${c.concept ? `<span class="muted">${esc(c.concept)}</span>` : ''}</div></div>
      <div class="row">
        <button class="primary" data-a="edit" data-id="${c.id}">Edit</button>
        <button data-a="dup" data-id="${c.id}">Duplicate</button>
        <button data-a="tab" data-id="characters">← Library</button>
      </div>
    </div>
  </div>
  <div class="panel"><h3>Abilities</h3>
    <div class="sheet-cols">${cols || '<p class="muted">No abilities yet.</p>'}</div>
    <p class="muted">⚡ Powered: +1 Debt to any Drive per use, usable once per Page. ▢ Mundane: free, but Blocks for the rest of the Scene. The ability's level must be at least the die (or Inspiration) value.</p>
    ${c.characterConflict ? `<div class="ex">Character Conflict, Free ${esc(c.characterConflict.type)}: <b>${esc(c.characterConflict.text)}</b>
      <div class="muted">When it Resolves, this character leaves the Scene (p.103).</div></div>` : ''}
  </div>
  <div class="panel"><h3>Drives &amp; Debt <span class="muted">(total ${totalDebt(c)})</span></h3>
    ${drives}
    ${over.length ? '<p class="muted" style="color:var(--red)">At the start of each Page, for each Overdrawn Drive, roll the highest die this character owns and accept the roll only if it is lower (p.32).</p>' : ''}
  </div>
  ${(c.exemplars.length || exOf.length) ? `<div class="panel"><h3>Exemplars</h3>${exemplars}
    ${exOf.length ? `<p class="muted">This character is an Exemplar for: ${exOf.join(', ')}</p>` : ''}</div>` : ''}
  ${c.notes ? `<div class="panel"><h3>Notes</h3><div style="white-space:pre-wrap">${esc(c.notes)}</div></div>` : ''}`;
}

/* ---------- Editor ---------- */

  return `<div class="panel">

    <label>Concept<br><input class="full" data-f="concept" value="${esc(c.concept)}" placeholder="e.g. Patriotic flying brick"></label>

  ${renderCL(c)}
  <div class="panel"><h2>Abilities</h2>
    <p class="muted">Number each column 1, 2, 3… by how much each ability matters to you. Low levels get used early to raise your own dice. High levels are for later and for Reacting to good enemy rolls.</p>
    ${catsFor(c).map(k => renderCat(c,k)).join('')}
    ${c.kind==='nonperson' ? renderCC(c) : ''}
  </div>
  ${renderDrivesEdit(c)}
  ${renderExemplarsEdit(c)}

  <div class="panel sticky">
    <div id="validation" class="validation"></div>
    <div class="row"><button class="primary" data-a="save-draft" id="savebtn">Save</button><button data-a="cancel-draft">Cancel</button></div>

}
function renderCL(c){
  if (!ui.cl) ui.cl = blankCL();
  const cl = ui.cl;
  const pickers = c.kind === 'nonperson'
    ? `<label>Module<br>${groupedSelect('np', NONPERSON, cl.np)}</label>`
    : `<label>${c.kind==='super'?'Power Set':'Skill Set'}<br>${groupedSelect('set', c.kind==='super'?POWER_SETS:SKILL_SETS, cl.set)}</label>
       <label>Persona<br>${groupedSelect('persona', PERSONAE, cl.persona)}</label>`;
  const cols = clColumns(c);
  let body = '';
  if (cols){
    const chk = clCheck(cols);
    body = `<div class="cl-cols">${cols.map(col => `<div class="cl-col"><h5>${CAT_LABEL[col.cat]}</h5>
      ${col.items.map(it => `<span class="cl-item ${cl.crossed.includes(it.key)?'crossed':''}" data-a="cl-cross" data-id="${it.key}">${esc(it.name)}${it.powered?' <span class="bolt">⚡</span>':''}</span>`).join('')}</div>`).join('')}</div>
      <p class="muted">Click abilities to cross them out.${cols.length===2 ? ' This module has a Character Conflict, so cross out 2.' : ' Cross out 3, not all from one column.'}</p>
      <div class="row"><span class="${chk.ok?'ok':'muted'}">${esc(chk.msg)}</span><button class="primary" data-a="cl-build" ${chk.ok?'':'disabled'}>Build abilities</button></div>`;
  }
  const open = ui.clOpen || !c.abilities.length;
  return `<details class="panel cl" ${open?'open':''}><summary><b>Click and Lock builder</b> <span class="muted">— quick start from the book's modules</span></summary>
    <div class="row">${pickers}</div>${body}</details>`;
}
function powToggle(c, a){
  if (a.cat === 'power') return '<span class="pw on">⚡ powered</span>';
  if (a.cat === 'style' && c.kind === 'super')
    return `<label class="pw ${a.powered?'on':''}"><input type="checkbox" data-ab="${a.id}" data-k="powered" ${a.powered?'checked':''}> ⚡ powered</label>`;
  return '<span class="pw">mundane</span>';
}
function renderCat(c, k){
  const abs = c.abilities.filter(a => a.cat === k);
  return `<div class="cat">
    <div class="row spread"><h4>${CAT_LABEL[k]} <span class="muted">(${abs.length})</span></h4><button class="small" data-a="ab-add" data-id="${k}">+ Add</button></div>
    ${abs.map(a => `<div class="ab-row">
      <input class="lvl" type="number" min="1" max="5" data-ab="${a.id}" data-k="level" value="${a.level}" title="Level">
      <input class="grow" data-ab="${a.id}" data-k="name" value="${esc(a.name)}" placeholder="Ability name">
      ${powToggle(c, a)}
      <button class="small danger" data-a="ab-del" data-id="${a.id}">✕</button></div>`).join('')}
  </div>`;
}
function renderCC(c){
  const cc = c.characterConflict;
  return `<div class="cat">
    <label><input type="checkbox" data-cc="on" ${cc?'checked':''}> <b>Character Conflict</b></label>
    <span class="muted">Trade one whole ability column for a Free Conflict. When it Resolves, this character leaves the Scene (p.103).</span>
    ${cc ? `<div class="row"><select data-cc="type">${opt('Event','Event',cc.type)}${opt('Goal','Goal',cc.type)}</select>
      <input class="grow" data-cc="text" value="${esc(cc.text)}" placeholder="e.g. Neck and Neck"></div>` : ''}
  </div>`;
}
function renderDrivesEdit(c){
  const modeSel = `<select data-f="driveMode">${opt('heroic','Heroic Drives',c.driveMode)}${opt('villainous','Villainous Drives',c.driveMode)}${opt('undiff','Undifferentiated (bit-part)',c.driveMode)}${opt('none','No Drives',c.driveMode)}</select>`;
  let body;
  if (hasDetailedDrives(c)){
    const sum = Object.values(c.drives).reduce((a,d) => a + (Number(d.strength)||0), 0);
    body = Object.entries(c.drives).map(([n,d]) => `<div class="drive-row"><b>${n}</b>
      <input type="number" min="1" max="5" data-drive="${n}" value="${d.strength}"><span class="muted">How much the story revolves around ${DRIVE_DESC[n]}</span></div>`).join('')
      + `<div class="row">Total: <b id="drivesum">${sum}</b> / 9 <span class="muted">(each 1–5, must total exactly 9)</span></div>`;
  } else if (c.driveMode === 'undiff'){
    body = '<p class="muted">A single Debt stack. Overdrawn when it holds more than 5. May Stake up to 3 on any one Conflict. Good for lackeys and bit-part supers.</p>';
  } else {
    body = `<p class="muted">${c.kind==='super' ? 'Supers usually need Drives. Powered abilities generate Debt.' : 'Mundane and non-person characters normally have no Drives.'}</p>`;
  }
  return `<div class="panel"><div class="row spread"><h2>Drives</h2>${modeSel}</div>${body}
    <p class="muted">Track Debt on the character sheet.</p></div>`;
}
function renderExemplarsEdit(c){
  const others = state.characters.filter(o => o.id !== c.id).sort((a,b) => (a.name||'').localeCompare(b.name||''));
  const drives = Object.keys(c.drives);

    <div class="row spread"><h2>Exemplars</h2><button class="small" data-a="ex-add">+ Add Exemplar</button></div>

    ${c.exemplars.map((x,i) => `<div class="ex">
      <div class="row spread"><b>Exemplar ${i+1}</b><button class="small danger" data-a="ex-del" data-id="${x.id}">Remove</button></div>
      <div class="row">
        <label>Library character<br><select data-ex="${x.id}" data-k="targetId">${opt('','— not in library —',x.targetId)}${others.map(o => opt(o.id, o.name||'(unnamed)', x.targetId)).join('')}</select></label>
        ${x.targetId ? '' : `<label class="grow">…or just a name<br><input class="full" data-ex="${x.id}" data-k="name" value="${esc(x.name)}"></label>`}
        <label>Drive<br><select data-ex="${x.id}" data-k="drive">${opt('','—',x.drive)}${drives.map(d => opt(d,d,x.drive)).join('')}</select></label>
      </div>
      <label>Root conflict<br><input class="full" data-ex="${x.id}" data-k="root" value="${esc(x.root)}" placeholder="This good thing, but that bad thing"></label>
      <div class="row">
        <select data-ex="${x.id}" data-k="conflictType">${opt('Event','Event',x.conflictType)}${opt('Goal','Goal',x.conflictType)}</select>
        <input class="grow" data-ex="${x.id}" data-k="conflictText" value="${esc(x.conflictText)}" placeholder="Free Conflict, e.g. Liz is about to die">
      </div>
      <label>Shared with<br><select data-ex="${x.id}" data-k="sharedWithId">${opt('','— not shared (the free Exemplar) —',x.sharedWithId)}${others.map(o => opt(o.id, o.name||'(unnamed)', x.sharedWithId)).join('')}</select></label>
    </div>`).join('')}
  </div>`;
}
function updateValidation(){
  const el = document.getElementById('validation');
  if (!el || !ui.draft) return;
  const {E, W} = validate(ui.draft);
  el.innerHTML = (E.length
      ? `<div class="err"><b>Rules issues</b><ul>${E.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`
      : '<div class="ok">✓ Follows the creation rules.</div>')
    + (W.length ? `<div class="warn"><b>Reminders</b><ul>${W.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '');
  const b = document.getElementById('savebtn');
  if (b) b.textContent = E.length ? 'Save anyway (house rule)' : 'Save';
  const ds = document.getElementById('drivesum');
  if (ds && hasDetailedDrives(ui.draft)) ds.textContent = Object.values(ui.draft.drives).reduce((a,d) => a + (Number(d.strength)||0), 0);
}
function changeKind(d, k){
  if (d.kind === k) return;
  d.abilities.forEach(a => {
    if (k === 'super' && a.cat === 'skill'){ a.cat = 'power'; a.powered = true; }
    else if (k !== 'super' && a.cat === 'power'){ a.cat = 'skill'; }
    if (k !== 'super') a.powered = false;
  });
  if (k === 'super' && d.driveMode === 'none'){ d.driveMode = 'heroic'; d.drives = makeDrives('heroic'); }
  if (k !== 'super'){ d.driveMode = 'none'; d.drives = {}; d.undiffDebt = 0; }
  if (k !== 'nonperson') d.characterConflict = null;
  d.kind = k;
  ui.cl = blankCL();
}

/* ================= IMPORT / EXPORT ================= */
function download(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function mergeChars(list){
  const existing = new Set(state.characters.map(c => c.id)), map = {};
  const incoming = list.map(normalizeLoadedChar);
  incoming.forEach(c => { if (existing.has(c.id)){ const n = uid(); map[c.id] = n; c.id = n; c.name += ' (imported)'; } });
  incoming.forEach(c => {
    if (!seatById(c.spotlightSeat)) c.spotlightSeat = '';
    c.exemplars.forEach(x => {
      if (map[x.targetId]) x.targetId = map[x.targetId];
      if (map[x.sharedWithId]) x.sharedWithId = map[x.sharedWithId];
    });
    state.characters.push(c);
  });
  addLog(`Imported ${incoming.length} character(s)`);
  alert(`Imported ${incoming.length} character(s).`);
}
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (ui.importMode === 'game'){
        if (!data.seats && !data.characters) throw new Error("This doesn't look like a Capes Tracker game file.");
        if (!confirm('Replace the ENTIRE current game with this file?')) return;
        state = normalizeState(data);
        addLog('Imported game file');
        ui.tab = 'table';
      } else {
        const list = Array.isArray(data) ? data : data.characters;
        if (!Array.isArray(list)) throw new Error('No characters found in this file.');
        mergeChars(list);
      }
      save(); render();
    } catch(err){ alert('Import failed: ' + err.message); }
  };
  r.readAsText(f);
});

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const id = b.dataset.id, x = b.dataset.x, d = ui.draft;
  const seat = id && seatById(id);
  switch (b.dataset.a){
    case 'tab':
      if (ui.tab === 'edit' && !confirm('Discard unsaved changes to this character?')) return;
      ui.draft = null; ui.tab = id; break;

    /* seats */
    case 'seat-add': {
      const letter = String.fromCharCode(65 + state.seats.length);
      state.seats.push(mkSeat('Seat ' + letter)); addLog(`Added Seat ${letter}`); break;
    }
    case 'seat-del':
      if (!confirm(`Remove ${seat.name}? Its Story Tokens and Inspirations are lost.`)) return;
      state.seats = state.seats.filter(s => s.id !== id);
      state.characters.forEach(c => { if (c.spotlightSeat === id) c.spotlightSeat = ''; });
      addLog(`Removed ${seat.name}`); break;
    case 'seat-up': case 'seat-down': {
      const i = state.seats.indexOf(seat), j = b.dataset.a === 'seat-up' ? i - 1 : i + 1;
      [state.seats[i], state.seats[j]] = [state.seats[j], state.seats[i]]; break;
    }
    case 'st-plus': seat.storyTokens++; addLog(`${seat.name}: +1 Story Token (${seat.storyTokens})`); break;
    case 'st-minus': seat.storyTokens = Math.max(0, seat.storyTokens - 1); addLog(`${seat.name}: −1 Story Token (${seat.storyTokens})`); break;
    case 'insp-add': {
      const v = Math.min(6, Math.max(1, Number(document.querySelector(`[data-insp-val="${id}"]`).value) || 1));
      const tag = document.querySelector(`[data-insp-tag="${id}"]`).value.trim();
      seat.inspirations.push({value:v, forTag:tag});
      addLog(`${seat.name}: gained ${v}-point Inspiration${tag ? ' for ' + tag : ''}`); break;
    }
    case 'insp-up': { const ins = seat.inspirations[x]; ins.value = Math.min(6, ins.value + 1); addLog(`${seat.name}: raised Inspiration to ${ins.value}`); break; }
    case 'insp-del': { const [ins] = seat.inspirations.splice(x, 1); addLog(`${seat.name}: spent ${ins.value}-point Inspiration${ins.forTag ? ' (' + ins.forTag + ')' : ''}`); break; }

    /* table */
    case 'code-example':
      if (state.comicsCode.length && !confirm('Replace your current Comics Code with the example?')) return;
      state.comicsCode = [...EXAMPLE_CODE]; break;
    case 'export-game': download(`capes-game-${today()}.json`, state); return;
    case 'export-chars': download(`capes-characters-${today()}.json`, {version:1, characters:state.characters}); return;
    case 'import-game': case 'import-chars': {
      ui.importMode = b.dataset.a === 'import-game' ? 'game' : 'chars';
      const f = document.getElementById('file'); f.value = ''; f.click(); return;
    }
    case 'reset-all':
      if (!confirm('Erase ALL Seats, characters, Comics Code and log? Export a backup first if you want one.')) return;
      state = defaultState(); ui = {tab:'table', draft:null, viewId:null, cl:null, clOpen:false, filter:'', importMode:null}; break;
    case 'clear-log': state.log = []; break;

    /* library */
    case 'new-char': ui.draft = blankCharacter(id); ui.cl = blankCL(); ui.clOpen = false; ui.tab = 'edit'; break;
    case 'view': ui.viewId = id; ui.tab = 'sheet'; break;
    case 'edit': ui.draft = clone(charById(id)); ui.cl = blankCL(); ui.clOpen = false; ui.tab = 'edit'; break;
    case 'dup': {
      const c = clone(charById(id));
      c.id = uid(); c.name = (c.name || 'Character') + ' (copy)';
      c.abilities.forEach(a => a.id = uid()); c.exemplars.forEach(x => x.id = uid());
      state.characters.push(c); addLog(`Duplicated ${c.name}`);
      ui.viewId = c.id; ui.tab = 'sheet'; break;
    }
    case 'del': {
      const c = charById(id);
      if (!confirm(`Delete ${c.name || 'this character'}? This cannot be undone.`)) return;
      state.characters = state.characters.filter(o => o.id !== id);
      state.characters.forEach(o => o.exemplars.forEach(ex => {
        if (ex.targetId === id){ ex.targetId = ''; ex.name = c.name; }
        if (ex.sharedWithId === id) ex.sharedWithId = '';
      }));
      addLog(`Deleted ${c.name}`);
      if (ui.tab === 'sheet') ui.tab = 'characters'; break;
    }
    case 'debt-plus': case 'debt-minus': {
      const c = charById(id), delta = b.dataset.a === 'debt-plus' ? 1 : -1;
      if (x === '__undiff'){ c.undiffDebt = Math.max(0, c.undiffDebt + delta); addLog(`${c.name}: Debt ${delta>0?'+1':'−1'} (${c.undiffDebt})`); }
      else { const dr = c.drives[x]; dr.debt = Math.max(0, dr.debt + delta); addLog(`${c.name}: ${x} Debt ${delta>0?'+1':'−1'} (${dr.debt}/${dr.strength})${dr.debt > dr.strength ? ' OVERDRAWN' : ''}`); }
      break;
    }

    /* editor */
    case 'ab-add': {
      const n = d.abilities.filter(a => a.cat === id).length;
      d.abilities.push({id:uid(), name:'', cat:id, level:n + 1, powered:id === 'power'}); break;
    }
    case 'ab-del': d.abilities = d.abilities.filter(a => a.id !== id); break;
    case 'ex-add': { const ex = blankExemplar(); ex.drive = Object.keys(d.drives)[0] || ''; d.exemplars.push(ex); break; }
    case 'ex-del': d.exemplars = d.exemplars.filter(ex => ex.id !== id); break;
    case 'cl-cross': {
      const cr = ui.cl.crossed, i = cr.indexOf(id);
      i >= 0 ? cr.splice(i, 1) : cr.push(id); ui.clOpen = true; break;
    }
    case 'cl-build': buildFromCL(); break;
    case 'save-draft': {
      const {E} = validate(d);
      if (E.length && !confirm(`This character breaks ${E.length} creation rule(s):\n\n• ${E.join('\n• ')}\n\nSave anyway as a house rule?`)) return;
      normalizeChar(d);
      const i = state.characters.findIndex(c => c.id === d.id);
      if (i >= 0) state.characters[i] = d; else state.characters.push(d);
      addLog(`${i >= 0 ? 'Updated' : 'Created'} ${d.name || '(unnamed)'}`);
      ui.viewId = d.id; ui.draft = null; ui.tab = 'sheet'; break;
    }
    case 'cancel-draft': {
      const existed = !!charById(d.id);
      ui.draft = null;
      if (existed){ ui.viewId = d.id; ui.tab = 'sheet'; } else ui.tab = 'characters';
      render(); return;
    }
    default: return;
  }
  if (ui.tab !== 'edit') save();
  render();
});

document.addEventListener('input', e => {
  const t = e.target, d = ui.draft;
  if (t.matches('[data-filter]')){
    ui.filter = t.value;
    const l = document.getElementById('charlist'); if (l) l.innerHTML = renderCharList();
    return;
  }
  if (t.matches('[data-code]')){
    state.comicsCode = t.value.split('\n').map(s => s.trim()).filter(Boolean);
    save(); return;
  }
  if (!d) return;
  if (t.dataset.f && t.tagName !== 'SELECT') d[t.dataset.f] = t.value;
  else if (t.dataset.ab && t.type !== 'checkbox'){
    const a = d.abilities.find(x => x.id === t.dataset.ab);
    if (a) a[t.dataset.k] = t.dataset.k === 'level' ? Number(t.value) : t.value;
  }
  else if (t.dataset.drive) d.drives[t.dataset.drive].strength = Number(t.value);
  else if (t.dataset.ex && t.tagName !== 'SELECT'){
    const x = d.exemplars.find(ex => ex.id === t.dataset.ex);
    if (x) x[t.dataset.k] = t.value;
  }
  else if (t.dataset.cc === 'text' && d.characterConflict) d.characterConflict.text = t.value;
  else return;
  updateValidation();
});

document.addEventListener('change', e => {
  const t = e.target, d = ui.draft;
  if (t.dataset.seat){
    const s = seatById(t.dataset.seat);
    if (s){ s.name = t.value.trim() || s.name; save(); }
    return;
  }
  if (t.dataset.cl){ ui.cl[t.dataset.cl] = t.value; ui.cl.crossed = []; ui.clOpen = true; render(); return; }
  if (!d) return;
  if (t.dataset.f === 'kind') changeKind(d, t.value);
  else if (t.dataset.f === 'driveMode'){
    d.driveMode = t.value;
    d.drives = hasDetailedDrives(d) ? makeDrives(t.value, d.drives) : {};
    d.exemplars.forEach(x => { if (!(x.drive in d.drives)) x.drive = ''; });
  }
  else if (t.dataset.f && t.tagName === 'SELECT') d[t.dataset.f] = t.value;
  else if (t.dataset.ab && t.type === 'checkbox'){
    const a = d.abilities.find(x => x.id === t.dataset.ab); if (a) a.powered = t.checked;
  }
  else if (t.dataset.ex && t.tagName === 'SELECT'){
    const x = d.exemplars.find(ex => ex.id === t.dataset.ex);
    if (x){ x[t.dataset.k] = t.value; if (t.dataset.k === 'targetId' && t.value) x.name = charById(t.value).name; }
  }
  else if (t.dataset.cc === 'on') d.characterConflict = t.checked ? (d.characterConflict || {type:'Event', text:''}) : null;
  else if (t.dataset.cc === 'type' && d.characterConflict) d.characterConflict.type = t.value;
  else return;
  render();
});

document.addEventListener('toggle', e => {
  if (e.target.matches && e.target.matches('details.cl')) ui.clOpen = e.target.open;

window.addEventListener('beforeunload', e => {

// STEP 2 — SCENE & PAGE ENGINE (complete)

const PHASES = [['start','1 · Start of Page'],['claims','2 · Conflicts & Claims'],['actions','3 · Actions'],['resolve','4 · Resolve']];
const undoStack = [];
let sui = blankSui();
function blankSui(seat){
  return {actSeat:seat||'', actChar:'', mode:'die', abId:'', target:'', support:'', drive:'', inspIdx:'',
    pending:null, react:null, rSeat:'', rChar:'', rAb:'', rSupport:'', rDrive:'', tool:null, resolve:null};
}
function settings(){ if (!state.settings) state.settings = {physical:false, override:false}; return state.settings; }
const SC = () => state.scene || null;
const sum = a => a.reduce((x,y) => x + y, 0);
const seatName = id => (seatById(id) || {}).name || '?';
const cname = id => (charById(id) || {}).name || '?';
const confById = id => SC() ? SC().conflicts.find(k => k.id === id) : null;
const sideById = (k, id) => k ? k.sides.find(s => s.id === id) : null;
const val = sel => { const el = document.querySelector(sel); return el ? el.value : ''; };

/* ---------- Undo ---------- */
function pushUndo(){
  undoStack.push(JSON.stringify({scene:state.scene, seats:state.seats, characters:state.characters,
    sceneCount:state.sceneCount, lastDeclarer:state.lastDeclarer, sui}));
  if (undoStack.length > 40) undoStack.shift();
}
function undo(silent){
  const raw = undoStack.pop(); if (!raw) return;
  const o = JSON.parse(raw);
  state.scene = o.scene; state.seats = o.seats; state.characters = o.characters;
  state.sceneCount = o.sceneCount; state.lastDeclarer = o.lastDeclarer; sui = o.sui;
  if (!silent) addLog('Undo');
}

/* ---------- Debt ---------- */
function driveKeys(c){ return !c ? [] : c.driveMode === 'undiff' ? ['__undiff'] : hasDetailedDrives(c) ? Object.keys(c.drives) : []; }
const driveLabel = k => k === '__undiff' ? 'Debt' : k;
function getDebt(c,k){ return k === '__undiff' ? c.undiffDebt : (c.drives[k] ? c.drives[k].debt : 0); }
function driveCap(c,k){ return k === '__undiff' ? 5 : (c.drives[k] ? c.drives[k].strength : 0); }
function stakeCap(c,k){ return k === '__undiff' ? 3 : driveCap(c,k); }
function addDebt(c,k,n){
  if (k === '__undiff') c.undiffDebt = Math.max(0, c.undiffDebt + n);
  else if (c.drives[k]) c.drives[k].debt = Math.max(0, c.drives[k].debt + n);
}

/* ---------- Seats & cast ---------- */
function seatOf(charId){ const sc = SC(); const e = sc && sc.cast.find(x => x.charId === charId); return e ? e.seatId : ''; }
function orderFrom(seatId){ const i = Math.max(0, state.seats.findIndex(s => s.id === seatId)); return state.seats.slice(i).concat(state.seats.slice(0, i)); }
function nextSeat(seatId){ const i = state.seats.findIndex(s => s.id === seatId); return state.seats[(i + 1) % state.seats.length].id; }
function castChars(seatId){ const sc = SC(); return sc ? sc.cast.filter(e => !seatId || e.seatId === seatId).map(e => charById(e.charId)).filter(Boolean) : []; }

/* ---------- Conflicts ---------- */
function mkSide(label){ return {id:uid(), label, dice:[1], allies:[], stakes:[], claimedBy:null, claimPaid:false, gloated:0}; }
function mkConflict(type, text, creatorId, ccOf){ return {id:uid(), type, text, creatorId:creatorId||'', ccOf:ccOf||'', sides:[mkSide('Side 1'), mkSide('Side 2')]}; }
function controlOf(k){ const t = k.sides.map(s => sum(s.dice)), m = Math.max(...t); return t.filter(v => v === m).length === 1 ? k.sides[t.indexOf(m)].id : null; }
const stakeTokens = s => sum(s.stakes.map(x => x.amount));
function setAlly(k, sideId, charId){
  k.sides.forEach(s => s.allies = s.allies.filter(a => a !== charId));
  const s = sideById(k, sideId); if (!s) return;
  s.allies.push(charId);
  if (/^Side \d+$/.test(s.label)) s.label = cname(charId);
}
const sideOfChar = (k, charId) => k.sides.find(s => s.allies.includes(charId));
function refundStakes(k, mult){ k.sides.forEach(s => s.stakes.forEach(st => { const c = charById(st.charId); if (c) addDebt(c, st.drive, st.amount * mult); })); }
function allDice(sc){
  const out = [];
  sc.conflicts.forEach(k => k.sides.forEach(s => s.dice.forEach((v,i) => out.push({key:`${k.id}|${s.id}|${i}`, label:`${k.text} — ${s.label}: ${v}`}))));
  return out;
}
function parseTarget(key){
  if (!key) return null;
  const [kid, sid, i] = key.split('|'); const k = confById(kid), s = sideById(k, sid);
  if (!s || s.dice[+i] === undefined) return null;
  return {k, s, i:+i, v:s.dice[+i]};
}
function evenSplit(v, n){ const b = Math.floor(v / n), r = v % n; return Array.from({length:n}, (_, i) => i < r ? b + 1 : b); }
const priorDrives = (k, cid) => k.sides.flatMap(x => x.stakes).filter(x => x.charId === cid);

/* ---------- Abilities ---------- */
const abKey = (c, a) => c.id + '|' + a.id;
function abilityProblem(c, a, need){
  const sc = SC(), key = abKey(c, a);
  if (a.level < need) return `level ${a.level} < ${need}`;
  if (!a.powered && sc.blocked.includes(key)) return 'Blocked this Scene';
  if (a.powered && sc.page.poweredUsed.includes(key)) return 'used this Page';
  if (a.powered && !driveKeys(c).length) return 'no Drives for Debt';
  return '';
}
function abilityOptions(c, need, sel){
  if (!c) return '';
  return c.abilities.map(a => {
    const p = abilityProblem(c, a, need), dis = p && !settings().override;
    return `<option value="${a.id}"${a.id === sel ? ' selected' : ''}${dis ? ' disabled' : ''}>${esc(a.name)} (${a.level}${a.powered ? ' ⚡' : ''})${p ? ' — ' + esc(p) : ''}</option>`;
  }).join('');
}
function driveSelect(c, field, sel){
  return `<label>Debt goes to<br><select data-s="${field}">${driveKeys(c).map(k => opt(k, `${driveLabel(k)} (${getDebt(c,k)}/${driveCap(c,k)})`, sel)).join('')}</select></label>`;
}
function payAbility(c, a, drive){
  const sc = SC(), key = abKey(c, a);
  if (a.powered){
    sc.page.poweredUsed.push(key);
    const keys = driveKeys(c), k = keys.includes(drive) ? drive : keys[0];
    if (!k) return '';
    addDebt(c, k, 1);
    return ` (+1 Debt → ${driveLabel(k)}${getDebt(c,k) > driveCap(c,k) ? ', OVERDRAWN' : ''})`;
  }
  sc.blocked.push(key);
  return ' (Blocked for the rest of the Scene)';
}
function d6(){
  if (settings().physical){
    while (true){
      const r = prompt('Roll a physical d6 and enter the result (1–6):');
      if (r === null) return null;
      const v = parseInt(r, 10);
      if (v >= 1 && v <= 6) return v;
    }
  }
  return 1 + Math.floor(Math.random() * 6);
}
function useAction(c){
  const pg = SC().page, n = pg.actionsUsed[c.id] || 0;
  if (n >= 1){
    const seat = seatById(seatOf(c.id));
    if (!seat) return false;
    if (seat.storyTokens < 1 && !settings().override){ alert(`${c.name} already acted this Page. An extra Action costs 1 Story Token, and ${seat.name} has none.`); return false; }
    if (!confirm(`${c.name} already acted this Page. Pay 1 Story Token from ${seat.name} for an extra Action?`)) return false;
    seat.storyTokens = Math.max(0, seat.storyTokens - 1);
    addLog(`${seat.name} pays 1 Story Token for an extra Action`);
  }
  pg.actionsUsed[c.id] = n + 1;
  return true;
}
const vetoOk = () => confirm('Any player may veto an Event, for any reason (p.28).\nPlaying every Seat, would any of them object?\n\nOK = no veto, add it.');

/* ---------- Scene & Page lifecycle ---------- */
function newPage(n, starter){ return {number:n, starterSeat:starter, phase:'start', claimsUsed:{}, actionsUsed:{}, poweredUsed:[], overChecked:[]}; }
function startScene(declarer, title){
  state.sceneCount = (state.sceneCount || 0) + 1;
  state.scene = {id:uid(), number:state.sceneCount, title, declarerSeat:declarer, cast:[], castFree:[], blocked:[], exUsed:[], conflicts:[], resolved:[], page:newPage(1, declarer)};
  state.lastDeclarer = declarer;
  addLog(`=== Scene ${state.sceneCount} begins${title ? ': ' + title : ''} (declared by ${seatName(declarer)}) ===`);
}
function freeConflicts(sc){
  const out = [], inCast = new Set(sc.cast.map(e => e.charId));
  castChars().forEach(c => {
    c.exemplars.forEach(x => {
      const key = c.id + '|' + x.id;
      if (x.targetId && inCast.has(x.targetId) && String(x.conflictText || '').trim() && !sc.exUsed.includes(key))
        out.push({key, type:x.conflictType, text:x.conflictText, creatorId:c.id, label:`${c.name} & ${cname(x.targetId)}, ${x.drive || '?'} Exemplar`});
    });
    if (c.kind === 'nonperson' && c.characterConflict && String(c.characterConflict.text || '').trim() && !sc.conflicts.some(k => k.ccOf === c.id))
      out.push({key:'cc|' + c.id, type:c.characterConflict.type, text:c.characterConflict.text, creatorId:c.id, cc:c.id, label:`${c.name}'s Character Conflict`});
  });
  return out;
}
function overdrawnCheck(c){
  const sc = SC(), out = [];
  for (const dn of overdrawnDrives(c)){
    let best = null;
    sc.conflicts.forEach(k => k.sides.forEach(s => { if (s.allies.includes(c.id)) s.dice.forEach((v,i) => { if (!best || v > best.v) best = {k, s, i, v}; }); }));
    if (!best){ out.push(`${dn}: owns no dice`); continue; }
    const r = d6(); if (r === null) break;
    if (r < best.v){ best.s.dice[best.i] = r; out.push(`${dn}: rolled ${r} on "${best.k.text}" (was ${best.v}), accepted`); }
    else out.push(`${dn}: rolled ${r} vs ${best.v}, not lower, so the die stays`);
  }
  sc.page.overChecked.push(c.id);
  addLog(`Overdrawn check, ${c.name}: ${out.join('; ') || 'nothing to roll'}`);
}
function claim(k, s, seatId){
  const pg = SC().page, seat = seatById(seatId), ov = settings().override;
  if (s.claimedBy){ alert('That side is already Claimed this Page.'); return false; }
  const mine = castChars(seatId).map(c => c.id);
  const here = s.allies.some(a => mine.includes(a));
  const elsewhere = k.sides.some(x => x !== s && x.allies.some(a => mine.includes(a)));
  if (!here && elsewhere && !ov){ alert(`${seat.name}'s characters are Allied with a different side. You may only Claim a side you're Allied with, or any side if you have no Ally (p.22).`); return false; }
  const n = pg.claimsUsed[seatId] || 0;
  if (n >= 1){
    if (seat.storyTokens < 1 && !ov){ alert(`${seat.name} already Claimed this Page. Extra Claims cost 1 Story Token, and it has none.`); return false; }
    if (!confirm(`${seat.name} already Claimed this Page. Pay 1 Story Token for another Claim?`)) return false;
    seat.storyTokens = Math.max(0, seat.storyTokens - 1); s.claimPaid = true;
  }
  pg.claimsUsed[seatId] = n + 1; s.claimedBy = seatId;
  addLog(`${seat.name} Claims "${s.label}" on "${k.text}"${s.claimPaid ? ' (1 Story Token)' : ''}`);
  return true;
}

/* ---------- Resolution maths ---------- */
function defaultPairs(k, W){
  const lose = [];
  k.sides.filter(s => s !== W).forEach(s => s.dice.forEach((v,i) => lose.push({key:s.id + ':' + i, v})));
  lose.sort((a,b) => b.v - a.v);
  const wi = W.dice.map((v,i) => ({i, v})).sort((a,b) => b.v - a.v);
  const pairs = {};
  wi.forEach((w,n) => pairs[w.i] = lose[n] ? lose[n].key : '');
  return pairs;
}
function resolutionPlan(k, r){
  const W = sideById(k, r.winnerId), losers = k.sides.filter(s => s !== W), lose = [];
  losers.forEach(s => s.dice.forEach((v,i) => lose.push({key:s.id + ':' + i, side:s, v})));
  const used = new Set(), ins = [];
  W.dice.forEach((v, wi) => {
    const l = lose.find(x => x.key === r.pairs[wi] && !used.has(x.key));
    if (l){ used.add(l.key); const d = v - l.v; if (d > 0) ins.push({side:W, value:d}); else if (d < 0) ins.push({side:l.side, value:-d}); }
    else ins.push({side:W, value:v});
  });
  lose.filter(l => !used.has(l.key)).forEach(l => ins.push({side:l.side, value:l.v}));
  return {W, losers, lose, ins};
}
function tokenPlan(k, W, losers, resolver){
  const tokens = [];
  W.stakes.forEach(st => { for (let i = 0; i < st.amount; i++) tokens.push(seatOf(st.charId)); });
  const eligible = orderFrom(nextSeat(resolver)).map(s => s.id)
    .filter(id => id !== resolver && losers.some(s => s.allies.some(a => seatOf(a) === id)));
  const creatorSeat = k.creatorId && losers.some(s => s.allies.includes(k.creatorId)) ? seatOf(k.creatorId) : '';
  const alloc = {}; let discarded = 0, rr = 0;
  tokens.forEach((src, i) => {
    let to = '';
    if (i === 0 && creatorSeat && creatorSeat !== resolver && creatorSeat !== src) to = creatorSeat;
    else for (let j = 0; j < eligible.length; j++){
      const c = eligible[(rr + j) % eligible.length];
      if (c !== src){ to = c; rr = (rr + j + 1) % eligible.length; break; }
    }
    if (to) alloc[to] = (alloc[to] || 0) + 1; else discarded++;
  });
  return {alloc, discarded, total:tokens.length};
}
function inspRecipient(x, W, r, resolver){
  if (x.side === W) return {seat:resolver, tag: r.forSide[W.id] ? cname(r.forSide[W.id]) : W.label};
  const cid = r.forSide[x.side.id];
  if (cid && seatOf(cid)) return {seat:seatOf(cid), tag:cname(cid)};
  if (x.side.claimedBy) return {seat:x.side.claimedBy, tag:x.side.label};
  return {seat:'', tag:x.side.label};
}
function applyResolution(){
  const sc = SC(), r = sui.resolve, k = confById(r.confId);
  const plan = resolutionPlan(k, r), W = plan.W, resolver = W.claimedBy, tp = tokenPlan(k, W, plan.losers, resolver), lines = [];
  plan.losers.forEach(s => s.stakes.forEach(st => {
    const c = charById(st.charId); if (!c) return;
    addDebt(c, st.drive, 2 * st.amount);
    lines.push(`${c.name} takes back ${2 * st.amount} ${driveLabel(st.drive)}${overdrawnDrives(c).length ? ' (Overdrawn!)' : ''}`);
  }));
  Object.entries(tp.alloc).forEach(([sid, n]) => { const se = seatById(sid); if (se){ se.storyTokens += n; lines.push(`${se.name} +${n} Story Token${n > 1 ? 's' : ''}`); } });
  if (tp.discarded) lines.push(`${tp.discarded} Story Token(s) discarded`);
  plan.ins.forEach(x => {
    const rec = inspRecipient(x, W, r, resolver), se = seatById(rec.seat);
    if (se){ se.inspirations.push({value:x.value, forTag:rec.tag}); lines.push(`${se.name} gains ${x.value}-pt Inspiration for ${rec.tag}`); }
    else lines.push(`${x.value}-pt Inspiration for ${rec.tag} discarded`);
  });
  const narration = String(r.narr || '').trim();
  sc.conflicts = sc.conflicts.filter(x => x !== k);
  sc.resolved.push({type:k.type, text:k.text, winner:W.label, by:seatName(resolver), page:sc.page.number, narration});
  addLog(`RESOLVED ${k.type} "${k.text}" for ${W.label} by ${seatName(resolver)}: ${lines.join('; ') || 'no payouts'}${narration ? ` — "${narration}"` : ''}`);
  sui.resolve = null;
  if (k.ccOf && charById(k.ccOf) && confirm(`That was ${cname(k.ccOf)}'s Character Conflict. Remove ${cname(k.ccOf)} from the Scene (p.103)?`)){
    sc.cast = sc.cast.filter(e => e.charId !== k.ccOf); addLog(`${cname(k.ccOf)} leaves the Scene`);
  }
}

/* ---------- Rendering ---------- */
function renderScene(){
  const sc = SC();
  if (!sc) return renderSceneStart();
  if (!sc.castFree) sc.castFree = [];
  sc.cast = sc.cast.filter(e => charById(e.charId) && seatById(e.seatId));
  if (!seatById(sc.page.starterSeat)) sc.page.starterSeat = state.seats[0].id;
  if (!seatById(sui.actSeat)) sui.actSeat = sc.page.starterSeat;
  if (sui.resolve && !confById(sui.resolve.confId)) sui.resolve = null;
  if (sui.tool && !confById(sui.tool.confId)) sui.tool = null;
  return renderSceneHeader(sc) + ((sui.pending || sui.react) ? renderRollPanel(sc) : renderPhasePanel(sc))
    + renderConflicts(sc) + renderCast(sc) + renderHistory(sc);
}
function renderSceneStart(){
  const sugg = state.lastDeclarer && seatById(state.lastDeclarer) ? nextSeat(state.lastDeclarer) : state.seats[0].id;
  return `<div class="panel"><h2>Start a Scene</h2>
    <p class="muted">The Seat to the left of the last declarer gets first chance to declare. If it declines, the chance passes clockwise (p.20).</p>
    <div class="row">
      <label>Declared by<br><select id="sc-decl">${state.seats.map(s => opt(s.id, s.name, sugg)).join('')}</select></label>
      <label class="grow">What's happening?<br><input class="full" id="sc-title" placeholder="e.g. Charity gala at the Egyptian exhibit"></label>
    </div>
    <div class="row"><button class="primary" data-a="sc-start">Start Scene ${(state.sceneCount || 0) + 1}</button></div>
    <p class="muted">Pick the kind of Scene you need. Long fights generate Debt. Short personal scenes burn Debt and generate Inspirations and Story Tokens (p.135–136).</p></div>`;
}
function renderSceneHeader(sc){
  const pg = sc.page, st = settings();
  return `<div class="panel">
    <div class="row spread"><h2>Scene ${sc.number}${sc.title ? ': ' + esc(sc.title) : ''} <span class="muted">· Page ${pg.number}</span></h2>
      <div class="row"><button data-a="sc-undo" ${undoStack.length ? '' : 'disabled'}>↶ Undo</button>
        <button data-a="sc-end-page">End Page ▸</button><button class="danger" data-a="sc-end-scene">End Scene</button></div></div>
    <div class="row"><span class="muted">Turn order (★ Starter). Click a Seat to act as it:</span>
      ${orderFrom(pg.starterSeat).map((s,i) => `<button class="small ${s.id === sui.actSeat ? 'primary' : ''}" data-a="sc-act" data-id="${s.id}">${i === 0 ? '★ ' : ''}${esc(s.name)} · ${s.storyTokens} ST${s.inspirations.length ? ' · Insp ' + s.inspirations.map(x => x.value).join('/') : ''}</button>`).join('')}</div>
    <div class="row">${PHASES.map(([k,l]) => `<button class="${pg.phase === k ? 'primary' : ''}" data-a="sc-phase" data-id="${k}">${l}</button>`).join('')}</div>
    <div class="row">
      <label><input type="checkbox" data-s="physical" ${st.physical ? 'checked' : ''}> Roll physical dice (I'll type results)</label>
      <label><input type="checkbox" data-s="override" ${st.override ? 'checked' : ''}> House-rule override (allow illegal moves, edit dice)</label>
    </div></div>`;
}
function renderPhasePanel(sc){
  const pg = sc.page, ph = pg.phase;
  if (ph === 'start'){
    const over = castChars().filter(c => overdrawnDrives(c).length);
    return `<div class="panel"><h3>Start of Page ${pg.number}: ${esc(seatName(pg.starterSeat))} is Starter</h3>
      ${!sc.cast.length ? '<p class="hint">No one is in the Scene yet. Add characters in the <b>Cast</b> panel below.</p>' : ''}
      ${over.length ? over.map(c => { const done = pg.overChecked.includes(c.id);
        return `<div class="row"><b>${esc(c.name)}</b> is Overdrawn in ${overdrawnDrives(c).map(esc).join(', ')}
          <button class="small" data-a="sc-overcheck" data-id="${c.id}" ${done ? 'disabled' : ''}>${done ? 'Checked ✓' : '🎲 Roll Overdrawn check'}</button></div>`; }).join('')
        : '<p class="muted">Nobody in the Scene is Overdrawn.</p>'}
      <p class="muted">For each Overdrawn Drive, roll the highest die the character owns. The new roll only counts if it's lower (p.32). Narrate how their doubts get in the way.</p>
      <button class="primary" data-a="sc-phase" data-id="claims">Go to Conflicts &amp; Claims ▸</button></div>`;
  }
  if (ph === 'claims'){
    const free = freeConflicts(sc), as = seatById(sui.actSeat), mine = castChars(sui.actSeat);
    return `<div class="panel"><h3>Conflicts &amp; Claims</h3>
      <p class="muted">Clockwise from the Starter, each Seat may add Free Conflicts and Claim one side for free. Extra Claims and Conflicts added here cost 1 Story Token each. Claim using the buttons on each Conflict. You're acting as <b>${esc(as.name)}</b>.</p>
      ${free.length ? `<div class="row"><span class="muted">Free Conflicts available:</span>${free.map(f => `<button class="small" data-a="sc-free" data-id="${esc(f.key)}">${esc(f.type)}: ${esc(f.text)} <span class="muted">(${esc(f.label)})</span></button>`).join('')}</div>` : ''}
      <div class="row"><select id="nc-type">${opt('Goal','Goal','Goal')}${opt('Event','Event','')}</select>
        <input class="grow" id="nc-text" placeholder="New Conflict…">
        <select id="nc-creator"><option value="">creator: none</option>${castChars().map(c => opt(c.id, c.name, mine[0] ? mine[0].id : '')).join('')}</select>
        <button data-a="sc-conf-paid">Add (1 Story Token from ${esc(as.name)})</button></div>
      <p class="muted"><b>Goal:</b> someone tries to do something. Only that character's player may veto it. <b>Event:</b> something that will definitely happen. Anyone may veto it, so keep it vague enough for either side (p.28–29).
      After Claims comes free narration: anyone may narrate anything a Conflict doesn't cover, until the Starter takes an Action.</p>
      <button class="primary" data-a="sc-phase" data-id="actions">Go to Actions ▸</button></div>`;
  }
  if (ph === 'actions') return renderActionPanel(sc);
  const claimed = [];
  orderFrom(pg.starterSeat).forEach(se => sc.conflicts.forEach(k => k.sides.forEach(s => {
    if (s.claimedBy !== se.id) return;
    const c = controlOf(k) === s.id;
    claimed.push(`<li>${esc(se.name)}: "${esc(k.text)}", ${esc(s.label)}: ${c ? (s.gloated === pg.number ? '<span class="muted">Gloated</span>' : '<b class="ok">Controls, ready to Resolve</b>') : '<span class="muted">doesn\'t Control, so nothing happens</span>'}</li>`);
  })));
  return `<div class="panel"><h3>Resolve</h3>
    <p class="muted">In turn order from the Starter, each Seat checks the sides it Claimed. If a claimed side Controls, Resolve it, or Gloat if the outcome would break the Comics Code. Use Deadlock on a tie nobody can break.</p>
    <ul>${claimed.join('') || '<li class="muted">No Claims this Page.</li>'}</ul>
    <button class="primary" data-a="sc-end-page">End Page ▸</button></div>`;
}
function renderActionPanel(sc){
  const seat = seatById(sui.actSeat), chars = castChars(sui.actSeat);
  const foot = `<div class="row"><button data-a="sc-next-seat">Next Seat ▸</button><button class="primary" data-a="sc-phase" data-id="resolve">Go to Resolve ▸</button></div>`;
  if (!chars.length) return `<div class="panel"><h3>Actions: ${esc(seat.name)}</h3><p class="muted">${esc(seat.name)} has no characters in this Scene.</p>${foot}</div>`;
  if (!chars.some(c => c.id === sui.actChar)){ sui.actChar = chars[0].id; sui.abId = ''; }
  const c = charById(sui.actChar), used = sc.page.actionsUsed[c.id] || 0;
  const a = c.abilities.find(x => x.id === sui.abId);
  let body = '';
  if (sui.mode === 'die'){
    const dice = allDice(sc);
    if (!dice.some(d => d.key === sui.target)){ sui.target = dice[0] ? dice[0].key : ''; sui.support = ''; }
    const t = parseTarget(sui.target);
    if (!t) body = '<p class="muted">No Conflicts yet. Create one first.</p>';
    else {
      if (!sideById(t.k, sui.support)){ const m = sideOfChar(t.k, c.id); sui.support = m ? m.id : t.s.id; }
      body = `<div class="row">
        <label>Target die<br><select data-s="target">${dice.map(d => opt(d.key, d.label, sui.target)).join('')}</select></label>
        <label>Supporting side<br><select data-s="support">${t.k.sides.map(s => opt(s.id, s.label, sui.support)).join('')}</select></label></div>
        <div class="row"><label>Ability (level ≥ ${t.v})<br><select data-s="abId"><option value="">— choose —</option>${abilityOptions(c, t.v, sui.abId)}</select></label>
        ${a && a.powered ? driveSelect(c, 'drive', sui.drive) : ''}
        <button class="primary" data-a="sc-roll" ${a ? '' : 'disabled'}>🎲 Roll</button></div>
        <p class="muted">Roll up a die on your side, or roll down an opponent's. Either way the character becomes Allied with the side they support.</p>`;
    }
  } else if (sui.mode === 'insp'){
    const ins = seatById(seatOf(c.id)).inspirations;
    if (!ins.length) body = `<p class="muted">${esc(seat.name)} has no Inspirations.</p>`;
    else {
      if (!ins[sui.inspIdx]) sui.inspIdx = '0';
      const iv = ins[+sui.inspIdx].value;
      body = `<div class="row"><label>Inspiration<br><select data-s="inspIdx">${ins.map((x,j) => opt(String(j), `${x.value} for ${x.forTag || 'anyone'}`, String(sui.inspIdx))).join('')}</select></label>
        <label>Ability (level ≥ ${iv})<br><select data-s="abId"><option value="">— choose —</option>${abilityOptions(c, iv, sui.abId)}</select></label>
        ${a && a.powered ? driveSelect(c, 'drive', sui.drive) : ''}

function renderTool(k){

      <p class="muted">Using ${esc(seatName(sui.actSeat))}'s Inspirations. Click a different Seat in the turn order to use theirs. An Inspiration may only raise a die on the side of the character or group it's for (p.25).</p>`

  } else body = cd ? `<div class="row"><select id="tl-cd">${cd}</select> splits ${dieSel} ${apply('Schism')}${close}</div>

function renderResolve(k, sc){
  const r = sui.resolve, plan = resolutionPlan(k, r), W = plan.W, resolver = W.claimedBy;

  const tokLines = Object.entries(tp.alloc).map(([sid,n]) => `${esc(seatName(sid))} +${n}`);
  const insLines = plan.ins.map(x => { const rec = inspRecipient(x, W, r, resolver); return `${x.value} pt → ${rec.seat ? esc(seatName(rec.seat)) + ' (for ' + esc(rec.tag) + ')' : 'discarded'}`; });
  return `<div class="conf resolving">
    <div class="row spread"><div><span class="badge ${k.type === 'Event' ? 'ev' : 'go'}">${esc(k.type)}</span> <b>Resolving: ${esc(k.text)}</b></div>
      <span>for <b>${esc(W.label)}</b> by ${esc(seatName(resolver))}</span></div>
    <p class="muted">${k.type === 'Event' ? 'The Event happens no matter what. You narrate how it happens and what it leads to.' : `You narrate whether "${esc(W.label)}" gets what it wants. If a Goal fails, that character can't try the same Goal again this Scene.`} Remember Not Yet: nothing about this outcome is settled until now.</p>
    ${state.comicsCode.length ? `<details><summary class="muted">Comics Code check: if this outcome would break the Code, Cancel and Gloat instead.</summary><ul>${state.comicsCode.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
    <h4>Match dice</h4>

    <p class="muted">Each pair gives an Inspiration worth the difference, to whichever side rolled higher. Equal pairs give nothing. Unmatched dice give their full value to their own side (p.30).</p>

    <div class="row"><button class="primary" data-a="sc-resolve-apply">Apply Resolution</button><button data-a="sc-resolve-cancel">Cancel</button></div></div>`;

/* ---------- Hook into the app ---------- */
render = function(){

  if (ui.tab === 'table') m.innerHTML = renderTable();
  else if (ui.tab === 'scene') m.innerHTML = renderScene();
  else if (ui.tab === 'characters') m.innerHTML = renderCharacters();

};
renderNav = function(){
  const cur = ui.tab === 'table' ? 'table' : ui.tab === 'scene' ? 'scene' : 'characters';
  document.getElementById('nav').innerHTML = [['table','Table'],['scene','Scene' + (state.scene ? ' ●' : '')],['characters','Characters']]
    .map(([k,l]) => `<button data-a="tab" data-id="${k}" class="${k === cur ? 'active' : ''}">${l}</button>`).join('');
