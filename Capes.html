/* ---------- Scene events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled || !b.dataset.a.startsWith('sc-')) return;
  const A = b.dataset.a, id = b.dataset.id, sc = SC(), ov = settings().override;
  const k = confById(b.dataset.conf), s = sideById(k, b.dataset.side);
  switch (A){
    case 'sc-start': pushUndo(); startScene(val('#sc-decl'), val('#sc-title').trim()); sui = blankSui(SC().page.starterSeat); break;
    case 'sc-undo': undo(); break;
    case 'sc-act': sui.actSeat = id; sui.actChar = ''; sui.abId = ''; break;
    case 'sc-next-seat': sui.actSeat = nextSeat(sui.actSeat); sui.actChar = ''; sui.abId = ''; break;
    case 'sc-mode': sui.mode = id; sui.abId = ''; break;
    case 'sc-phase':
      if (sui.pending || sui.react){ alert('Finish the current roll first.'); return; }
      sc.page.phase = id;
      if (id === 'actions' || id === 'resolve' || id === 'claims') sui.actSeat = sc.page.starterSeat;
      sui.actChar = ''; sui.abId = ''; sui.tool = null; break;
    case 'sc-overcheck': { const c = charById(id); if (!c) return; pushUndo(); overdrawnCheck(c); break; }

    /* cast */
    case 'sc-cast-add': {
      const c = charById(val('#cast-char')), se = seatById(val('#cast-seat'));
      if (!c || !se) return;
      const paid = sc.castFree.includes(se.id);
      if (paid){
        if (se.storyTokens < 1 && !ov){ alert(`${se.name} already took its free character. Extra characters cost 1 Story Token, and it has none.`); return; }
        if (!confirm(`${se.name} already took its free character. Pay 1 Story Token to add ${c.name}?`)) return;
      }
      pushUndo();
      if (paid) se.storyTokens = Math.max(0, se.storyTokens - 1); else sc.castFree.push(se.id);
      sc.cast.push({charId:c.id, seatId:se.id});
      addLog(`${se.name} plays ${c.name}${paid ? ' (1 Story Token)' : ''}`);
      if (c.kind === 'super' && !driveKeys(c).length) alert(`${c.name} has no Drives, so their powered abilities can't take Debt. Set Drives on the Characters tab.`);
      break;
    }
    case 'sc-cast-del':
      if (!confirm(`Remove ${cname(id)} from the Scene?`)) return;
      pushUndo(); sc.cast = sc.cast.filter(x => x.charId !== id); addLog(`${cname(id)} leaves the Scene`); break;

    /* conflicts & claims */
    case 'sc-free': {
      const f = freeConflicts(sc).find(x => x.key === id); if (!f) return;
      pushUndo(); sc.conflicts.push(mkConflict(f.type, f.text, f.creatorId, f.cc || ''));
      if (!f.cc) sc.exUsed.push(f.key);
      addLog(`Free ${f.type} added: "${f.text}" (${f.label})`); break;
    }
    case 'sc-conf-paid': {
      const text = val('#nc-text').trim(), type = val('#nc-type'), se = seatById(sui.actSeat);
      if (!text){ alert('Write the Conflict first.'); return; }
      if (se.storyTokens < 1 && !ov){ alert(`Adding a Conflict here costs 1 Story Token, and ${se.name} has none. Create it as an Action instead.`); return; }
      if (type === 'Event' && !vetoOk()) return;
      pushUndo(); se.storyTokens = Math.max(0, se.storyTokens - 1);
      sc.conflicts.push(mkConflict(type, text, val('#nc-creator')));
      addLog(`${se.name} pays 1 Story Token to add ${type}: "${text}"`); break;
    }
    case 'sc-conf-action': {
      const c = charById(sui.actChar), text = val('#ac-text').trim(), type = val('#ac-type');
      if (!c) return;
      if (!text){ alert('Write the Conflict first.'); return; }
      if (type === 'Event' && !vetoOk()) return;
      pushUndo(); if (!useAction(c)){ undoStack.pop(); return; }
      sc.conflicts.push(mkConflict(type, text, c.id));
      addLog(`${c.name}'s Action: creates ${type} "${text}"`); break;
    }
    case 'sc-conf-del':
      if (!confirm(`Remove "${k.text}"? Any Staked Debt goes back to its Drives as it was (not doubled).`)) return;
      pushUndo(); refundStakes(k, 1); sc.conflicts = sc.conflicts.filter(x => x !== k); addLog(`Removed Conflict "${k.text}"`); break;
    case 'sc-claim': pushUndo(); if (!claim(k, s, sui.actSeat)){ undoStack.pop(); return; } break;
    case 'sc-unclaim': {
      pushUndo(); const se = seatById(s.claimedBy);
      if (s.claimPaid && se) se.storyTokens++;
      sc.page.claimsUsed[s.claimedBy] = Math.max(0, (sc.page.claimsUsed[s.claimedBy] || 1) - 1);
      s.claimedBy = null; s.claimPaid = false; break;
    }
    case 'sc-die-set': {
      const v = parseInt(prompt('Override: set this die to (1–6):', s.dice[b.dataset.x]), 10);
      if (!(v >= 1 && v <= 6)) return;
      pushUndo(); s.dice[b.dataset.x] = v; addLog(`Override: die on "${k.text}" (${s.label}) set to ${v}`); break;
    }

    /* actions & reactions */
    case 'sc-roll': {
      const c = charById(sui.actChar), a = c && c.abilities.find(x => x.id === sui.abId), t = parseTarget(sui.target);
      if (!c || !a || !t) return;
      const p = abilityProblem(c, a, t.v); if (p && !ov){ alert(`${a.name} can't be used: ${p}.`); return; }
      pushUndo(); if (!useAction(c)){ undoStack.pop(); return; }
      const r = d6(); if (r === null){ undo(true); render(); return; }
      const note = payAbility(c, a, sui.drive);
      setAlly(t.k, sui.support || t.s.id, c.id);
      sui.pending = {kind:'action', confId:t.k.id, sideId:t.s.id, idx:t.i, old:t.v, rolled:r, charId:c.id, abName:a.name, actorSeat:sui.actSeat};
      addLog(`${c.name} uses ${a.name}${note} on "${t.k.text}" (${t.s.label} ${t.v}): rolls ${r}`);
      sui.abId = ''; break;
    }
    case 'sc-raise': {
      const c = charById(sui.actChar), se = c && seatById(seatOf(c.id)), ins = se && se.inspirations[+sui.inspIdx], a = c && c.abilities.find(x => x.id === sui.abId);
      if (!ins || !a) return;
      if (ins.value >= 6){ alert('That Inspiration is already at 6.'); return; }
      const p = abilityProblem(c, a, ins.value); if (p && !ov){ alert(`${a.name} can't be used: ${p}.`); return; }
      pushUndo(); if (!useAction(c)){ undoStack.pop(); return; }
      const note = payAbility(c, a, sui.drive); ins.value++;
      addLog(`${c.name} uses ${a.name}${note} to raise an Inspiration (for ${ins.forTag || 'anyone'}) to ${ins.value}`);
      sui.abId = ''; break;
    }
    case 'sc-accept': {
      const p = sui.pending, k2 = confById(p.confId), s2 = sideById(k2, p.sideId);
      if (s2 && s2.dice[p.idx] !== undefined) s2.dice[p.idx] = p.rolled;
      addLog(`Accepted ${p.rolled} on "${k2 ? k2.text : '?'}"`);
      sui.react = p.kind === 'action' ? {confId:p.confId, sideId:p.sideId, idx:p.idx, actorSeat:p.actorSeat, reacted:[]} : p.ctx;
      sui.pending = null; sui.rSeat = ''; sui.rChar = ''; sui.rAb = ''; sui.rSupport = ''; break;
    }
    case 'sc-revert': {
      const p = sui.pending;
      addLog(`Turned the die back to ${p.old}${p.kind === 'action' ? ', so no Reactions' : ''}`);
      sui.react = p.kind === 'action' ? null : p.ctx; sui.pending = null; break;
    }
    case 'sc-react': {
      const r0 = sui.react, k2 = confById(r0.confId), s2 = sideById(k2, r0.sideId);
      if (!s2) return;
      const v = s2.dice[r0.idx], c = charById(sui.rChar), a = c && c.abilities.find(x => x.id === sui.rAb);
      if (!c || !a) return;
      if (r0.reacted.includes(sui.rSeat) && !ov){ alert('That Seat already Reacted to this Action.'); return; }
      const p = abilityProblem(c, a, v); if (p && !ov){ alert(`${a.name} can't be used: ${p}.`); return; }
      pushUndo();
      const r = d6(); if (r === null){ undo(true); render(); return; }
      const note = payAbility(c, a, sui.rDrive);
      setAlly(k2, sui.rSupport || s2.id, c.id);
      r0.reacted.push(sui.rSeat);
      sui.pending = {kind:'react', confId:r0.confId, sideId:r0.sideId, idx:r0.idx, old:v, rolled:r, charId:c.id, abName:a.name, actorSeat:r0.actorSeat, ctx:r0};
      sui.react = null;
      addLog(`Reaction: ${c.name} uses ${a.name}${note}, rolls ${r} (was ${v})`); break;
    }
    case 'sc-react-done': sui.react = null; break;

    /* stake / split / inspiration / schism */
    case 'sc-tool': sui.tool = {kind:id, confId:k.id, sideId:s.id}; break;
    case 'sc-tool-close': sui.tool = null; break;
    case 'sc-tool-apply': {
      const t = sui.tool, k2 = confById(t.confId), s2 = sideById(k2, t.sideId);
      if (!s2) return;
      if (t.kind === 'stake' || t.kind === 'schism'){
        const [cid, dr] = val('#tl-cd').split('|'), c = charById(cid);
        if (!c) return;
        const amt = t.kind === 'stake' ? Math.max(1, parseInt(val('#tl-amt'), 10) || 1) : 1;
        const prev = priorDrives(k2, cid);
        if (prev.some(x => x.drive !== dr) && !ov){ alert(`${c.name} already Staked a different Drive on this Conflict. Only one Drive per Conflict (p.36).`); return; }
        if (sum(prev.map(x => x.amount)) + amt > stakeCap(c, dr) && !ov){ alert(`That would put more than ${stakeCap(c, dr)} ${driveLabel(dr)} on this Conflict.`); return; }
        if (getDebt(c, dr) < amt && !ov){ alert(`${c.name} only has ${getDebt(c, dr)} ${driveLabel(dr)} Debt.`); return; }
        if (t.kind === 'stake'){
          const other = k2.sides.find(x => x !== s2 && x.allies.includes(cid));
          if (other && !ov){ alert(`${c.name} is Allied with "${other.label}". Use Schism to break away instead.`); return; }
          if (!confirm(`Is "${k2.text}" morally charged for ${c.name}'s ${driveLabel(dr)} Drive (p.32)?`)) return;
          pushUndo(); addDebt(c, dr, -amt);
          const ex = s2.stakes.find(x => x.charId === cid && x.drive === dr);
          if (ex) ex.amount += amt; else s2.stakes.push({charId:cid, drive:dr, amount:amt});
          setAlly(k2, s2.id, cid);
          addLog(`${c.name} Stakes ${amt} ${driveLabel(dr)} on "${k2.text}" (${s2.label})`);
        } else {
          const i = +val('#tl-die'), v = s2.dice[i];
          if (!s2.allies.includes(cid) && !ov){ alert(`${c.name} must already be Allied with "${s2.label}". Roll on its behalf first (p.63).`); return; }
          if (v < 2){ alert("A 1 can't be split."); return; }
          if (!confirm(`Is "${k2.text}" morally charged for ${c.name}'s ${driveLabel(dr)} Drive (p.32)?`)) return;
          pushUndo(); addDebt(c, dr, -1);
          const [hi, lo] = evenSplit(v, 2);
          s2.dice.splice(i, 1, lo);
          const ns = mkSide(c.name); ns.dice = [hi]; ns.stakes = [{charId:cid, drive:dr, amount:1}];
          k2.sides.push(ns); setAlly(k2, ns.id, cid);
          addLog(`${c.name} Schisms from "${s2.label}" on "${k2.text}": Stakes 1 ${driveLabel(dr)}, splits ${v} into ${hi}/${lo}, and founds a new side with the ${hi}`);
        }
      } else if (t.kind === 'split'){
        const i = +val('#tl-die'), n = Math.max(2, parseInt(val('#tl-n'), 10) || 2), v = s2.dice[i];
        if (v < n){ alert(`A ${v} can't be split into ${n} dice. Each die must be at least 1.`); return; }
        if (s2.dice.length - 1 + n > stakeTokens(s2) && !ov){ alert(`This side has ${stakeTokens(s2)} Staked Debt, so it can hold at most ${stakeTokens(s2)} dice. Stake more first.`); return; }
        pushUndo(); const parts = evenSplit(v, n); s2.dice.splice(i, 1, ...parts);
        addLog(`Split ${v} into ${parts.join('/')} on "${k2.text}" (${s2.label})`);
      } else {
        const se = seatById(sui.actSeat), j = +val('#tl-insp'), ins = se.inspirations[j], i = +val('#tl-die');
        if (!ins) return;
        if (ins.value <= s2.dice[i]){ alert(`That die is already ${s2.dice[i]}. The Inspiration (${ins.value}) wouldn't raise it.`); return; }
        pushUndo(); const old = s2.dice[i]; s2.dice[i] = ins.value; se.inspirations.splice(j, 1);
        addLog(`${se.name} spends a ${ins.value}-pt Inspiration (for ${ins.forTag || 'anyone'}) to raise a die from ${old} to ${ins.value} on "${k2.text}" (${s2.label})`);
      }
      sui.tool = null; break;
    }

    /* resolution */
    case 'sc-resolve-open': {
      const fs = {}; k.sides.forEach(x => fs[x.id] = x.allies[0] || '');
      sui.resolve = {confId:k.id, winnerId:s.id, pairs:defaultPairs(k, s), forSide:fs, narr:''}; sui.tool = null; break;
    }
    case 'sc-resolve-cancel': sui.resolve = null; break;
    case 'sc-resolve-apply': pushUndo(); applyResolution(); break;
    case 'sc-gloat': {
      const n = s.dice.filter(v => v > 1).length;
      if (!n){ alert('No dice above 1 to turn down.'); return; }
      const r = prompt(`Gloat (p.41): turn "${s.label}"'s dice to 1, starting with the highest. Each die turned earns ${seatName(s.claimedBy)} 1 Story Token. The Conflict stays on the table.\n\nHow many dice to turn down? (1–${n})`, String(n));
      if (r === null) return;
      const m = Math.min(n, Math.max(1, parseInt(r, 10) || 1));
      pushUndo();
      s.dice.map((v,i) => ({v, i})).sort((a,b) => b.v - a.v).slice(0, m).forEach(x => s.dice[x.i] = 1);
      seatById(s.claimedBy).storyTokens += m; s.gloated = sc.page.number;
      addLog(`${seatName(s.claimedBy)} GLOATS on "${k.text}": turns ${m} dice to 1, +${m} Story Token${m > 1 ? 's' : ''}`); break;
    }
    case 'sc-deadlock': {
      if (!confirm(`Deadlock "${k.text}"? Only do this if the tie can't be broken: nobody can Stake more and every die is a 6.\n\nAll Staked Debt counts as lost and comes back doubled. Every die becomes an Inspiration for its own side, with no matching. You narrate the outcome together (p.30).`)) return;
      pushUndo(); refundStakes(k, 2);
      k.sides.forEach(x => {
        const cid = x.allies[0], se = seatById(cid ? seatOf(cid) : x.claimedBy);
        if (se) x.dice.forEach(v => se.inspirations.push({value:v, forTag: cid ? cname(cid) : x.label}));
      });
      sc.conflicts = sc.conflicts.filter(x => x !== k);
      sc.resolved.push({type:k.type, text:k.text, winner:'Deadlock', by:'everyone', page:sc.page.number, narration:''});
      addLog(`DEADLOCK on "${k.text}": Stakes returned doubled, all dice converted to Inspirations`); break;
    }

    /* page & scene */
    case 'sc-end-page': {
      if (sui.pending || sui.react){ alert('Finish the current roll first.'); return; }
      const ready = sc.conflicts.some(x => x.sides.some(y => y.claimedBy && controlOf(x) === y.id && y.gloated !== sc.page.number));
      if (ready && !confirm('Some Claimed sides Control their Conflicts and haven\'t been Resolved or Gloated. End the Page anyway?')) return;
      pushUndo();
      sc.conflicts.forEach(x => x.sides.forEach(y => { y.claimedBy = null; y.claimPaid = false; }));
      const st = nextSeat(sc.page.starterSeat);
      addLog(`— End of Page ${sc.page.number}. Page ${sc.page.number + 1}: ${seatName(st)} is Starter —`);
      sc.page = newPage(sc.page.number + 1, st); sui = blankSui(st); break;
    }
    case 'sc-end-scene': {
      if (!confirm(`End Scene ${sc.number}? Unresolved Conflicts are dropped, and their Staked Debt goes back to its Drives as it was (not doubled). Mundane abilities unblock.`)) return;
      pushUndo();
      sc.conflicts.forEach(x => refundStakes(x, 1));
      addLog(`=== Scene ${sc.number} ends after ${sc.page.number} Page(s). ${sc.resolved.length} Conflict(s) resolved, ${sc.conflicts.length} dropped ===`);
      state.scene = null; sui = blankSui(); break;
    }
    default: return;
  }
  save(); render();
});

/* ---------- Generators ---------- */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let gs = {gender:'any', allit:3, era:5, spread:1, incForm:'by', incAllit:true, incStack:0, names:[], gadgets:[], incs:[]};

function genName(){
  const N = NAME_ROWS.length, r = rnd(N), g = gs.gender === 'any' ? rnd(2) : (gs.gender === 'male' ? 0 : 1), a = +gs.allit;
  const sr = a >= N ? rnd(N) : clamp(r + rnd(2 * a + 1) - a, 0, N - 1);
  return pick(NAME_ROWS[r][g]) + ' ' + pick(NAME_ROWS[sr][2]);
}
function genGadget(){
  const e = +gs.era, s = +gs.spread;
  const w = [0,1,2,3,4].map(c => GADGET_ROWS[clamp(e + rnd(2 * s + 1) - s, 0, 9)][c]);
  return w[0] + w[1] + ' ' + w.slice(2).join(' ');
}
function genIncant(){
  const R = INCANT_ROWS, r = rnd(R.length), cell = c => gs.incAllit ? R[r][c] : pick(R)[c];
  const who = cell(0), words = [cell(1)];
  for (let i = 0; i < +gs.incStack; i++) words.push(pick(R)[1 + rnd(2)]);
  words.push(cell(2));
  const phrase = words.join(' ');
  if (gs.incForm === 'of') return `the ${phrase} of ${who.replace(/'s$/, '')}`;
  if (gs.incForm === 'plain') return `${who} ${phrase}`;
  return `By ${who} ${phrase}!`;
}
function pushRes(list, v){ list.unshift(v); if (list.length > 12) list.pop(); }
function gLabel(k, v){
  v = +v;
  if (k === 'allit') return v === 0 ? 'same row (heavy)' : v >= NAME_ROWS.length ? 'anywhere (none)' : `±${v} rows`;
  if (k === 'era') return `${v} (${v < 3 ? 'modern' : v < 7 ? 'mid-century' : 'antique'})`;
  return `±${v}`;
}
function resList(list, asChar){
  if (!list.length) return '<p class="muted">Nothing yet.</p>';
  return list.map((v, i) => `<div class="row genres ${i === 0 ? 'first' : ''}"><span class="grow">${esc(v)}</span>

    ${asChar ? `<button class="small" data-a="gn-char" data-x="${esc(v)}">New character</button>` : ''}</div>`).join('');
}

/* ---------- Clipboard & download ---------- */
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); setSaved('Copied ✓'); } catch(e){ prompt('Copy this:', t); }
  ta.remove();
}
function copyText(t){
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => setSaved('Copied ✓'), () => fallbackCopy(t));
  else fallbackCopy(t);
}
function downloadText(name, text){
  const blob = new Blob([text], {type:'text/markdown'}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Journal ---------- */
addLog = function(msg, extra){
  const sc = state.scene;
  state.log.push(Object.assign({t:Date.now(), msg, scene: sc ? sc.number : null, page: sc ? sc.page.number : null}, extra || {}));
  if (state.log.length > 5000) state.log.splice(0, state.log.length - 5000);
};
function journalItems(){
  const items = []; let scene = 0;
  state.log.forEach((l, idx) => {
    const m = String(l.msg || ''); let x;
    if (l.kind === 'narr'){ items.push({type:'p', text:m, speaker:l.speaker || '', idx, scene}); return; }
    if ((x = m.match(/^=== Scene (\d+) begins(?:: (.*?))? \(declared by (.*?)\) ===$/))){
      scene = +x[1];
      items.push({type:'h2', text:`Scene ${x[1]}${x[2] ? ': ' + x[2] : ''}`, sub:`declared by ${x[3]}`, scene});

    }

function rollOdds(k, s, i, supId){
  const v = s.dice[i], good = r => supId === s.id ? r > v : r < v;
  let better = 0, ctrl = 0;
  const now = controlOf(k) === supId;
  for (let r = 1; r <= 6; r++){
    if (good(r)) better++;
    const old = s.dice[i]; s.dice[i] = good(r) ? r : v;
    if (controlOf(k) === supId) ctrl++;
    s.dice[i] = old;
  }
  return {better, ctrl, now};
}
const pct6 = n => Math.round(n / 6 * 100) + '%';
function oddsHTML(k, s, i, supId){
  const o = rollOdds(k, s, i, supId), sup = sideById(k, supId), dir = supId === s.id ? 'higher' : 'lower';
  return `<div class="odds">🎲 <b>${pct6(o.better)}</b> to roll ${dir} than ${s.dice[i]} · <b>${pct6(o.ctrl)}</b> that "${esc(sup.label)}" Controls afterward <span class="muted">(${o.now ? 'Controls now' : "doesn't Control now"})</span></div>`;
}

  return {sc, seat, ph, pos, last: pos === order.length - 1, mine, mineIds, others, mySide};
}

  // Low Debt
  x => x.mine.filter(c => c.kind === 'super' && driveKeys(c).length && totalDebt(c) < 2).map(c => ({s:3, tags:['debt'],
    t:`${c.name} has almost no Debt. Use powers freely, on Reactions too. Debt is fuel for Staking and Splitting.`, p:'p.130–131'})),
  // Heavy Debt
  x => x.mine.filter(c => totalDebt(c) >= 6).map(c => ({s:4, tags:['debt'],
    t:`${c.name} carries ${totalDebt(c)} Debt. Spawn minor Conflicts, Stake on them, and spend Story Tokens to Claim several per Page.`, p:'p.135'})),
  // Preventative Goal
  x => {
    if (x.sc.conflicts.some(q => /escape/i.test(q.text))) return [];
    for (const k of x.sc.conflicts){

    .filter(s => s.claimedBy === x.seat.id && controlOf(k) === s.id && s.gloated !== x.sc.page.number)
    .map(s => { const n = s.dice.filter(v => v > 1).length; return {s: x.ph === 'resolve' ? 6 : 3, tags:['tokens'],
      t:`If Resolving "${k.text}" would break the Comics Code, Gloat instead: ${n} die${n === 1 ? '' : 's'} above 1 means up to ${n} Story Token${n === 1 ? '' : 's'}. With a spare Story Token, buy an Action, Stake and Split first for a bigger Gloat (Multi-Gloat).`, p:'p.41, p.125'}; })),
  // Ready to React against high opposing dice
  x => {

      }));

  x => {

        const old = my.dice[i]; my.dice[i] = ins.value; const ok = controlOf(k) === my.id; my.dice[i] = old;
        if (ok) out.push({s:6, tags:['win'],
          t:`Spend your ${ins.value}-pt Inspiration (for ${ins.forTag || 'anyone'}) on the ${v} in "${k.text}" to take Control. Check that it's for that side.`, p:'p.25'});
      });
    }));
    return out.slice(0, 2);
  },
  // Instant-Split
  x => {
    if (!x.seat.inspirations.some(i => i.value === 2)) return [];
    if (!x.mine.some(c => driveKeys(c).some(d => getDebt(c, d) >= 2))) return [];
    const k = x.sc.conflicts.find(k => { const my = x.mySide(k); return my && my.dice.length === 1 && my.dice[0] === 1; });
    return [{s:3, tags:['win'],
      t:`Instant-Split${k ? ` on "${k.text}"` : ''}: raise a 1 to 2 with your 2-pt Inspiration, Stake 2, split into 1/1, then roll one of them.`, p:'p.124'}];
  },
  // Free Conflicts
  x => x.ph !== 'claims' ? [] : freeConflicts(x.sc).map(f => ({s: x.mineIds.has(f.creatorId) ? 5 : 3, tags:['story','tokens'],
    t:`Free Conflict available: ${f.type} "${f.text}" (${f.label}). Adding it costs nothing.`, p:'p.22, p.76'})),
  // Story Token Conflicts
  x => x.seat.storyTokens <= 1 ? [{s:3, tags:['tokens'],
    t:'Low on Story Tokens? Declare the Conflict the story obviously needs, one the other Seats will fight over. If the creator ends up on the losing side, they get the first Story Token.', p:'p.126, p.30'}] : [],
  // Distraction
  x => {
    const k = x.sc.conflicts.find(k => { const my = x.mySide(k), c = controlOf(k); return my && c && c !== my.id && sideById(k, c).stakes.length; });
    return k ? [{s:3, tags:['chaos','win'],
      t:`You're losing "${k.text}" to a side that has Staked on it. Create a Distraction Conflict they care about more (e.g. "Event: Headquarters self-destructs") and win this one while they're busy.`, p:'p.126'}] : [];
  },
  // Lose Stakes early
  x => (x.sc.page.number > 3 || x.seat.storyTokens > 2) ? [] : [{s:2, tags:['tokens','debt'],
    t:"Early in a story, losing a Conflict you Staked on is a good trade. You get the winners' Stakes as Story Tokens and your own Debt back doubled.", p:'p.135'}],
  // Rock the boat
  x => {
    const pool = state.characters.filter(c => !x.sc.cast.some(e => e.charId === c.id));
    if (!pool.length) return [];
    const linked = pool.find(c => c.exemplars.some(e => x.sc.cast.some(z => z.charId === e.targetId)) || castChars().some(z => z.exemplars.some(e => e.targetId === c.id)));
    const c = linked || pool.slice().sort((a,b) => (a.name || '').localeCompare(b.name || ''))[0];
    return [{s:1, tags:['chaos'],
      t:`Rock the boat: bring ${c.name} into the Scene${linked ? '. They have ties to someone already here' : ''}. Or roll a Twist below.`, p:'p.137'}];
  },
  // Spotlight
  x => {
    const sp = state.characters.filter(c => c.spotlightSeat === x.seat.id);
    const out = sp.filter(c => !x.mineIds.has(c.id)).map(c => ({s:2, tags:['spot'],
      t:`Your Spotlight character ${c.name} isn't in this Scene. That's fine if someone else fits better, or bring them in.`, p:'p.20, p.137'}));
    sp.filter(c => x.mineIds.has(c.id)).forEach(c => {
      const k = x.sc.conflicts.find(k => { const s = sideOfChar(k, c.id); return s && controlOf(k) !== s.id; });
      if (k) out.push({s:3, tags:['spot','win'], t:`${c.name} is losing "${k.text}". Spotlight moments are worth spending on.`, p:'p.119'});
    });
    return out;
  },
  // Story Steward
  x => {
    const th = (state.threads || {})[x.seat.id];
    return th ? [{s:2, tags:['story'],
      t:`Push your thread: "${th}". Create a Conflict that moves it one step closer to its next "things got worse" beat, and make it one the other Seats want to fight over.`, p:'p.143, p.147'}] : [];
  }
];
function advList(x){
  const w = AGENDAS[agendaOf(x.seat.id)][1];
  return ADV.flatMap(r => { try { return r(x) || []; } catch(e){ console.warn('Advisor rule failed', e); return []; } })
    .map(it => ({...it, score: it.s + it.tags.reduce((a,t) => a + (w[t] || 0), 0)}))
    .sort((a,b) => b.score - a.score);
}

/* ---------- Tables & oracle ---------- */
function castPick(pred){ const l = castChars().filter(pred); return l.length ? pick(l).name : null; }
function fillTpl(t){
  const any = () => castPick(() => true) || 'someone';
  return t.replace(/\{(\w)\}/g, (_, k) => {
    if (k === 'h') return castPick(c => c.driveMode === 'heroic') || any();
    if (k === 'v') return castPick(c => c.driveMode === 'villainous') || any();
    if (k === 'e') return pick(castChars().flatMap(c => c.exemplars.map(exName)).filter(Boolean)) || any();
    return any();
  });
}
function topDrive(){
  let best = null;
  castChars().forEach(c => driveKeys(c).forEach(d => {
    if (d === '__undiff') return;
    const n = getDebt(c, d); if (!best || n > best.n) best = {d, n};
  }));
  return best && best.n > 0 ? best.d : pick(Object.keys(DRIVE_PROMPTS));
}
function oracle(p){
  const r = rnd(100) + 1, yes = r <= p;
  let t = yes ? 'Yes' : 'No';
  if (yes && r <= p / 5) t = 'Yes, and…';
  else if (!yes && r > 100 - (100 - p) / 5) t = 'No, and…';
  else if (Math.abs(r - p) <= 5) t += ', but…';
  return `${t} (rolled ${r} vs ${p}%)`;
}

/* ---------- AI prompt ---------- */
function aiChar(c, sc){
  const groups = catsFor(c).map(cat => {
    const abs = c.abilities.filter(a => a.cat === cat).sort((a,b) => a.level - b.level).map(a => {
      const k = abKey(c, a), off = a.powered ? sc.page.poweredUsed.includes(k) : sc.blocked.includes(k);
      return `${a.name} ${a.level}${a.powered ? '⚡' : ''}${off ? (a.powered ? ' (used this Page)' : ' (Blocked)') : ''}`;
    });
    return abs.length ? `${CAT_LABEL[cat]}: ${abs.join(', ')}` : '';
  }).filter(Boolean).join('; ');
  const dr = driveKeys(c).map(d => `${driveLabel(d)} ${getDebt(c, d)}/${driveCap(c, d)}`).join(', ');
  const over = overdrawnDrives(c);
  const ex = c.exemplars.map(e => `${exName(e)} (${e.drive || '?'}${e.root ? '; ' + e.root : ''})`).join('; ');
  return `- ${c.name} [${seatName(seatOf(c.id))}; ${c.kind === 'nonperson' ? c.npType : KIND_LABEL[c.kind]}]${c.concept ? ' "' + c.concept + '"' : ''}. ${groups || 'No abilities'}.`
    + (dr ? ` Drives (Debt/Strength): ${dr}.` : '') + (over.length ? ` OVERDRAWN: ${over.join(', ')}.` : '') + (ex ? ` Exemplars: ${ex}.` : '');
}
function aiConf(k){
  const ctrl = controlOf(k);
  return `- ${k.type} "${k.text}"${k.creatorId ? ' (created by ' + cname(k.creatorId) + ')' : ''}${ctrl ? '' : ' [TIED]'}:` + k.sides.map(s =>
    `\n    · ${s.label}: dice ${s.dice.join('+')} = ${sum(s.dice)}; allies ${s.allies.map(cname).join(', ') || 'none'}; staked ${s.stakes.map(st => st.amount + ' ' + driveLabel(st.drive) + ' by ' + cname(st.charId)).join(', ') || 'nothing'}${s.claimedBy ? '; claimed by ' + seatName(s.claimedBy) : ''}${ctrl === s.id ? '; CONTROLS' : ''}`).join('');
}
function aiPrompt(task){
  const sc = SC(), x = advCtx(), ag = agendaOf(x.seat.id), th = (state.threads || {})[x.seat.id];
  const ph = (PHASES.find(p => p[0] === sc.page.phase) || ['', sc.page.phase])[1].replace(/^\d · /, '');
  const narr = state.log.filter(l => l.scene === sc.number && l.kind === 'narr').slice(-8);
  const mech = state.log.filter(l => l.scene === sc.number && l.kind !== 'narr').slice(-10);
  const L = [
    "I'm playing the GM-less superhero RPG Capes (Tony Lower-Basch, 2005) solo. I run every \"Seat\" (virtual player) myself and want help with one of them.",
    '', 'RULES REMINDER: ' + AI_RULES,
    '', `SCENE ${sc.number}${sc.title ? ': ' + sc.title : ''} · Page ${sc.page.number} · Phase: ${ph}`,
    '', 'COMICS CODE (these can never happen; the Resolver must Gloat instead):',
    ...(state.comicsCode.length ? state.comicsCode.map(c => '- ' + c) : ['- (none)']),
    '', 'SEATS in turn order (★ = Starter):',
    ...orderFrom(sc.page.starterSeat).map((s, i) => `- ${i === 0 ? '★ ' : ''}${s.name}: ${s.storyTokens} Story Tokens; Inspirations: ${s.inspirations.map(v => v.value + ' for ' + (v.forTag || 'anyone')).join(', ') || 'none'}; agenda: ${AGENDAS[agendaOf(s.id)][0]}`),
    '', 'CAST:', ...(castChars().length ? castChars().map(c => aiChar(c, sc)) : ['- (nobody yet)']),
    '', 'CONFLICTS:', ...(sc.conflicts.length ? sc.conflicts.map(aiConf) : ['- (none)']),
    '', 'STORY SO FAR THIS SCENE:', ...(narr.length ? narr.map(l => '- ' + (l.speaker ? l.speaker + ': ' : '') + l.msg) : ['- (no narration yet)']),
    '', 'RECENT GAME LOG:', ...(mech.length ? mech.map(l => '- ' + l.msg) : ['- (nothing yet)']),
    '', `TASK, for ${x.seat.name} (agenda: ${AGENDAS[ag][0]} — ${AGENDA_DESC[ag]}${th ? ` Story thread: "${th}"` : ''}):`,
    AI_TASKS[task][1]
  ];
  if (task === 'move'){
    const top = advList(x).slice(0, 3);
    if (top.length) L.push('', 'My tactics helper suggests (feel free to disagree):', ...top.map(t => '- ' + t.t));
  }
  return L.join('\n');
}

/* ---------- Render ---------- */
function renderAdvisor(){
  const x = advCtx(), ag = agendaOf(x.seat.id), list = advList(x), shown = ui.advAll ? list : list.slice(0, 4);
  const th = (state.threads || {})[x.seat.id] || '', res = ui.advRes || [];
  return `<details class="panel adv" ${ui.advOpen === false ? '' : 'open'}>
    <summary>🧠 Advisor: ${esc(x.seat.name)} <span class="badge">${esc(AGENDAS[ag][0])}</span> <span class="muted">· suggestions only, you decide</span></summary>
    <div class="row"><label>Agenda for ${esc(x.seat.name)}<br><select data-adv="agenda">${Object.entries(AGENDAS).map(([k,v]) => opt(k, v[0], ag)).join('')}</select></label>
      <span class="muted grow">${esc(AGENDA_DESC[ag])}</span></div>
    ${ag === 'steward' ? `<label>Story-Thread for ${esc(x.seat.name)}<br><input class="full" data-adv="thread" value="${esc(th)}" placeholder="e.g. Donna's parents visit; ends at a stilted dinner at La Bergerie"></label>` : ''}
    <div>${shown.map((it, i) => `<div class="sugg ${i === 0 ? 'top' : ''}">${esc(it.t)} <span class="cite">(${esc(it.p)})</span></div>`).join('') || '<p class="muted">No suggestions right now.</p>'}</div>
    ${list.length > 4 ? `<div class="row"><button class="small" data-a="adv-all">${ui.advAll ? 'Show fewer' : 'Show all ' + list.length}</button></div>` : ''}
    <details class="advtools" ${ui.advTools ? 'open' : ''}><summary>Prompt tables, oracle &amp; AI prompt</summary>
      <div class="row"><select data-adv="drive">${opt('auto', 'Most-indebted Drive', ui.advDrive || 'auto')}${Object.keys(DRIVE_PROMPTS).map(d => opt(d, d, ui.advDrive)).join('')}</select>
        <button data-a="adv-prompt">🎲 Drive prompt</button><button data-a="adv-twist">🔀 Twist</button></div>
      <div class="row"><input class="grow" id="adv-q" value="${esc(ui.advQ || '')}" placeholder="Yes/No question (optional), e.g. Is the bomb real?">
        <select data-adv="lv">${ODDS_LV.map(([n,p]) => opt(String(p), n, String(ui.advLv || 50))).join('')}</select>
        <button data-a="adv-oracle">Ask the oracle</button></div>
      ${res.length ? res.map((r, i) => `<div class="row genres ${i === 0 ? 'first' : ''}"><span class="grow">${esc(r)}</span>
        <button class="small" data-a="adv-jr" data-x="${i}">+ Journal</button><button class="small" data-a="gn-copy" data-x="${esc(r)}">Copy</button></div>`).join('')
        + '<div class="row"><button class="small" data-a="adv-clear">Clear results</button></div>' : ''}
      <div class="row"><select data-adv="aiTask">${Object.entries(AI_TASKS).map(([k,v]) => opt(k, v[0], ui.aiTask || 'move')).join('')}</select>
        <button class="primary" data-a="adv-ai">📋 Copy AI prompt</button></div>
      <p class="muted">Copies a full text summary of the table plus a task. Paste it into any chatbot. Nothing is sent anywhere by this file.</p>
    </details></details>`;
}
const _renderScene4 = renderScene;
renderScene = function(){
  const h = _renderScene4();
  if (!SC()) return h;
  const adv = renderAdvisor(), m = '<div class="panel"><h3>Narrate</h3>', i = h.indexOf(m);
  return i < 0 ? h + adv : h.slice(0, i) + adv + h.slice(i);
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled || !b.dataset.a.startsWith('adv-')) return;
  ui.advRes = ui.advRes || [];
  const push = t => { ui.advRes.unshift(t); if (ui.advRes.length > 8) ui.advRes.pop(); };
  switch (b.dataset.a){
    case 'adv-all': ui.advAll = !ui.advAll; break;
    case 'adv-prompt': {
      const d = ui.advDrive && ui.advDrive !== 'auto' ? ui.advDrive : topDrive();
      push(`${d}: ${fillTpl(pick(DRIVE_PROMPTS[d]))}`); break;
    }
    case 'adv-twist': push(`Twist: ${fillTpl(pick(TWISTS))}`); break;
    case 'adv-oracle': {
      const q = val('#adv-q').trim(); ui.advQ = '';
      push(`${q ? q + ' → ' : 'Oracle: '}${oracle(+(ui.advLv || 50))}`); break;
    }
    case 'adv-jr': {
      const t = ui.advRes[+b.dataset.x]; if (!t) return;
      addLog(t, {kind:'narr', speaker:''}); save(); break;
    }
    case 'adv-clear': ui.advRes = []; break;
    case 'adv-ai': copyText(aiPrompt(ui.aiTask || 'move')); return;
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.adv;
  if (!f) return;
  if (f === 'agenda'){ state.agendas = state.agendas || {}; state.agendas[sui.actSeat] = t.value; save(); render(); return; }
  if (f === 'thread'){ state.threads = state.threads || {}; state.threads[sui.actSeat] = t.value.trim(); save(); render(); return; }
  if (f === 'drive') ui.advDrive = t.value;
  else if (f === 'lv') ui.advLv = t.value;
  else if (f === 'aiTask') ui.aiTask = t.value;
});
document.addEventListener('input', e => { if (e.target.id === 'adv-q') ui.advQ = e.target.value; });
document.addEventListener('toggle', e => {
  const t = e.target;
  if (!t.matches) return;
  if (t.matches('details.adv')) ui.advOpen = t.open;
  else if (t.matches('details.advtools')) ui.advTools = t.open;
}, true);

/* ================= INIT ================= */
render();
setSaved(state.characters.length || state.log.length ? 'Loaded from this browser' : 'New game');
</script>
